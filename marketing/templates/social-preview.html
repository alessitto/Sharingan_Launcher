<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista previa social 1280×640</title>
<link rel="stylesheet" href="../brand/brand.css">
<style>
  /* Imagen al compartir el enlace (GitHub › Settings › Social preview, y la
     og:image de la web). 1280×640, con margen de 40 px. */
  body { width: 1280px; height: 640px; position: relative; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: var(--vineta), radial-gradient(45% 70% at 76% 50%, rgba(224,22,30,.5), transparent 75%), var(--tinta); }
  .shot { position: absolute; right: -60px; top: 110px; width: 640px; height: 400px; border-radius: 14px; background: url("../shots/biblioteca.jpg") left top / cover; transform: rotate(-3deg); }
  .l { position: absolute; left: 64px; top: 64px; font-size: 30px; }
  .t { position: absolute; left: 64px; top: 180px; width: 560px; font-size: 84px; font-weight: 900; letter-spacing: -0.04em; line-height: .93; }
  .s { position: absolute; left: 64px; bottom: 64px; font-size: 24px; font-weight: 600; color: var(--humo); }
</style>
</head>
<body class="grano">
  <div class="bg"></div>
  <div class="shot anillo"></div>
  <div class="l"><span class="lockup"><img src="../brand/logo/sharingan-mark.png" alt=""><span>Sharingan<small>Launcher</small></span></span></div>
  <div class="t" data-p="t" data-rich>Steam, Epic y GOG en *un solo launcher*</div>
  <div class="s" data-p="s">Gratis para Windows · alejandrodev.es/sharingan_launcher</div>
  <script src="shared.js"></script>
</body>
</html>
