          showNotification("Error al desvincular el ejecutable.", "error");
        }
      }

      async function openSortKeyEditor(id) {
        let game = libraryGamesCache.find((g) => String(g.id) === String(id));
        if (!game) {
          const { games, completedGames } = await window.electronAPI.getGames();
          game =
            games.find((g) => String(g.id) === String(id)) ||
            completedGames.find((g) => String(g.id) === String(id));
        }

        if (!game) {
          showNotification("No se encontró el juego.", "error");
          return;
        }

        const name = game.name || "Sin nombre";
        const currentSortKey = game.sortKey || name;

        const { value: newSortKey } = await openModal({
          eyebrow: "Biblioteca",
          title: "Nombre para ordenar",
          width: 440,
          html: `
          <div class="sortkey-modal">
            <img src="${coverOf(game)}" alt="${escapeHtml(name)}" class="sortkey-cover">
            <p>${escapeHtml(name)}</p>
            <span class="sl-hint">Se usa para colocarlo en el orden alfabético (por ejemplo, "Witcher 3" en vez de "The Witcher 3").</span>
          </div>
        `,
          input: "text",
          inputValue: currentSortKey,
          showCancelButton: true,
          confirmButtonText: "Guardar",
          cancelButtonText: "Cancelar",
        });

        if (newSortKey === undefined) return;

        try {
          await window.electronAPI.updateSortKey(id, newSortKey);
          await loadLibrary();
          showNotification("Orden actualizado correctamente.");
        } catch (err) {
          console.error(err);
          showNotification("Error al actualizar el orden.", "error");
        }
      }

      // ===============================
      // Sagas
      // ===============================
      // Una saga es una carpeta de juegos: se crea, se le meten juegos y ya
      // está - el orden lo pone sola por fecha de lanzamiento (main.js la
      // busca en IGDB si el juego no la trae). Se puede retocar arrastrando,
      // y "Ordenar por lanzamiento" lo vuelve a dejar cronológico. Biblioteca
      // y pasados muestran cada saga como un bloque en ese mismo orden.
      async function openSagasModal(selectId = null) {
        let sagas = (await window.electronAPI.getSagas()) || [];
        const { games: libGames, completedGames: doneGames } = await window.electronAPI.getGames();
        const allOwned = [...(libGames || []), ...(doneGames || [])];
        const byId = new Map(allOwned.map((g) => [Number(g.id), g]));
        const doneIds = new Set((doneGames || []).map((g) => Number(g.id)));

        let selectedId = sagas.some((s) => s.id === selectId) ? selectId : sagas[0]?.id || null;
        let query = "";
        let confirmingDelete = false;
        let busy = false;
        let root = null;
        // Sagas sugeridas (se cargan al abrir) y, para las que se acaban de
        // crear desde una sugerencia, qué juegos la formaban: salen abajo
        // como sugerencias para que el usuario meta los que quiera.
        let suggestions = null;
        const suggestedFor = new Map();

        const esc = escapeHtml;
        const selected = () => sagas.find((s) => s.id === selectedId) || null;
        const ownerOf = (gid) => sagas.find((s) => s.gameIds.includes(Number(gid)));
        const norm = (s) =>
          String(s || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .replace(/[^a-z0-9ñ ]+/g, " ")
            .replace(/\s+/g, " ")
            .trim();
        const countLabel = (n) => `${n} ${n === 1 ? "juego" : "juegos"}`;

        async function refresh(list) {
          sagas = list || (await window.electronAPI.getSagas()) || [];
          if (!sagas.some((s) => s.id === selectedId)) selectedId = sagas[0]?.id || null;
        }

        function thumbs(saga) {
          const covers = saga.gameIds.slice(0, 3).map((id) => coverOf(byId.get(id)));
          if (!covers.length) return `<span class="sg-thumb-empty">${icon("layers")}</span>`;
          return covers.map((c) => `<img src="${c}" alt="">`).join("");
        }

        function renderList() {
          const ul = root.querySelector(".sg-list");
          ul.innerHTML = sagas.length
            ? sagas
                .map(
                  (s) => `
              <li class="sg-item ${s.id === selectedId ? "is-active" : ""}" data-id="${s.id}" draggable="true">
                <span class="sg-item-thumbs">${thumbs(s)}</span>
                <span class="sg-item-text">
                  <span class="sg-item-name">${esc(s.name)}</span>
                  <span class="sg-item-count">${countLabel(s.gameIds.length)}</span>
                </span>
                <span class="sg-grip" title="Arrastra para reordenar">${icon("grip")}</span>
              </li>`
                )
                .join("")
            : `<li class="sg-list-empty">Aún no tienes sagas. Escribe un nombre arriba para crear la primera.</li>`;
          root.querySelector(".sg-side-hint").style.display = sagas.length > 1 ? "" : "none";
        }

        function renderDetail() {
          const s = selected();
          const d = root.querySelector(".sg-detail");
          if (!s) {
            d.innerHTML = `
              <div class="sg-blank">
                <span class="sg-blank-icon">${icon("layers")}</span>
                <h3>Agrupa tus juegos por saga</h3>
                <p>Crea una saga (por ejemplo, <em>Dark Souls</em>) y añádele sus juegos. Se ordenan solos por fecha de lanzamiento y en la biblioteca aparecen juntos, siempre en ese orden.</p>
              </div>`;
            return;
          }

          const deleteHtml = confirmingDelete
            ? `<span class="sg-del-confirm">
                 <span>¿Eliminar la saga? Los juegos no se borran.</span>
                 <button type="button" class="sl-btn sl-btn-ghost sl-btn-sm" data-act="del-no">Cancelar</button>
                 <button type="button" class="sl-btn sl-btn-danger sl-btn-sm" data-act="del-yes">Eliminar</button>
               </span>`
            : `<button type="button" class="icon-btn sg-del" data-act="del" title="Eliminar saga" aria-label="Eliminar saga">${icon("trash")}</button>`;

          d.innerHTML = `
            <div class="sg-head">
              <div class="sg-name-wrap" title="Haz clic para renombrar">
                <input type="text" class="sg-name" value="${esc(s.name)}" maxlength="80" spellcheck="false" aria-label="Nombre de la saga">
                ${icon("pencil", "sg-name-icon")}
              </div>
              <div class="sg-head-actions">
                ${confirmingDelete ? "" : `<button type="button" class="sl-btn sl-btn-ghost sl-btn-sm" data-act="sort" title="Vuelve a colocar los juegos por fecha de lanzamiento">${icon("calendar")}<span>Ordenar por lanzamiento</span></button>`}
                ${deleteHtml}
              </div>
            </div>
            <ol class="sg-games"></ol>
            <div class="sg-add">
              <label class="sg-search">
                ${icon("search")}
                <input type="text" class="sg-search-input" placeholder="Añadir juegos: busca en tu biblioteca" value="${esc(query)}">
              </label>
              <div class="sg-results"></div>
            </div>`;
          renderGames();
          renderResults();
        }

        function renderGames() {
          const s = selected();
          const ol = root.querySelector(".sg-games");
          if (!s || !ol) return;
          // Ordenar solo tiene sentido con dos juegos o más.
          root.querySelector('[data-act="sort"]')?.toggleAttribute("hidden", s.gameIds.length < 2);
          ol.innerHTML = s.gameIds.length
            ? s.gameIds
                .map((gid, i) => {
                  const g = byId.get(gid);
                  const meta = [releaseYear(g), doneIds.has(gid) ? "Pasado" : null].filter(Boolean).join(" · ");
                  return `
                <li class="sg-game" draggable="true" data-gid="${gid}">
                  <span class="sg-grip" title="Arrastra para reordenar">${icon("grip")}</span>
                  <span class="sg-game-pos">${i + 1}</span>
                  <img class="sg-game-cover" src="${coverOf(g)}" alt="">
                  <span class="sg-game-text">
                    <span class="sg-game-name">${esc(g?.name || "Juego eliminado")}</span>
                    <span class="sg-game-meta">${meta || "Sin fecha de lanzamiento"}</span>
                  </span>
                  <button type="button" class="icon-btn sg-game-remove" data-act="remove" data-gid="${gid}" title="Quitar de la saga" aria-label="Quitar de la saga">${icon("x")}</button>
                </li>`;
                })
                .join("")
            : `<li class="sg-games-empty">${icon("plus")}<span>Esta saga está vacía. Busca abajo sus juegos y pulsa en ellos para añadirlos; se colocan solos en orden de lanzamiento.</span></li>`;
        }

        function renderResults() {
          const s = selected();
          const box = root.querySelector(".sg-results");
          if (!s || !box) return;

          const q = norm(query);
          let list = allOwned.filter((g) => !s.gameIds.includes(Number(g.id)));
          let heading;
          if (q) {
            list = list.filter((g) => norm(g.name).includes(q));
            heading = `${icon("search")}Resultados`;
          } else {
            // Sugerencias: juegos cuyo nombre contiene el de la saga, más los
            // que la formaban si se creó desde una saga sugerida.
            const sn = norm(s.name);
            const extra = new Set(suggestedFor.get(s.id) || []);
            list = list.filter((g) => (sn && norm(g.name).includes(sn)) || extra.has(Number(g.id)));
            heading = `${icon("sparkles")}Sugerencias para esta saga`;
          }
          list = list
            .sort((a, b) => String(a.name).localeCompare(String(b.name), "es", { numeric: true }))
            .slice(0, 40);

          if (!list.length) {
            box.innerHTML = q
              ? `<p class="sg-results-empty">Ningún juego de tu biblioteca coincide con "${esc(query)}".</p>`
              : `<p class="sg-results-empty">Escribe para buscar entre los juegos de tu biblioteca.</p>`;
            return;
          }

          box.innerHTML = `
            <span class="sg-results-title">${heading}</span>
            <div class="sg-results-grid">
              ${list
                .map((g) => {
                  const owner = ownerOf(g.id);
                  return `
                <button type="button" class="sg-result" data-act="add" data-gid="${g.id}" title="Añadir a ${esc(s.name)}">
                  <img src="${coverOf(g)}" alt="">
                  <span class="sg-result-text">
                    <span class="sg-result-name">${esc(g.name)}</span>
                    ${owner ? `<span class="sg-result-meta">Ahora en ${esc(owner.name)}</span>` : ""}
                  </span>
                  <span class="sg-result-add">${icon("plus")}</span>
                </button>`;
                })
                .join("")}
            </div>`;
        }

        function renderSuggestions() {
          const box = root.querySelector(".sg-sugs");
          if (!box) return;
          if (suggestions === null) {
            box.innerHTML = `<p class="sg-sugs-loading"><span class="sl-spinner"></span>Buscando sagas en tu biblioteca…</p>`;
            return;
          }
          const taken = new Set(sagas.map((x) => norm(x.name)));
          suggestions = suggestions.filter((x) => !taken.has(norm(x.name)));
          if (!suggestions.length) {
            box.innerHTML = "";
            return;
          }
          box.innerHTML = `
            <span class="sg-sugs-title">${icon("sparkles")}Sagas sugeridas</span>
            <ul class="sg-sugs-list">
              ${suggestions
                .map(
                  (x, i) => `
                <li class="sg-sug">
                  <span class="sg-sug-text">
                    <span class="sg-sug-name">${esc(x.name)}</span>
                    <span class="sg-sug-meta">${countLabel(x.gameIds.length)} de tu biblioteca</span>
                  </span>
                  <button type="button" class="icon-btn sg-sug-yes" data-act="sug-yes" data-idx="${i}" title="Crear la saga" aria-label="Crear la saga">${icon("check")}</button>
                  <button type="button" class="icon-btn sg-sug-no" data-act="sug-no" data-idx="${i}" title="No sugerir más" aria-label="No sugerir más">${icon("x")}</button>
                </li>`
                )
                .join("")}
            </ul>`;
        }

        async function run(fn) {
          if (busy) return;
          busy = true;
          root.classList.add("is-busy");
          try {
            await fn();
          } catch (err) {
            console.error(err);
            showNotification("No se pudo guardar el cambio en la saga.", "error");
          } finally {
            busy = false;
            root.classList.remove("is-busy");
          }
        }

        async function createSaga(name) {
          const before = new Set(sagas.map((s) => s.id));
          await refresh(await window.electronAPI.createSaga(name));
          const created = sagas.find((s) => !before.has(s.id));
          if (created) selectedId = created.id;
          query = "";
          confirmingDelete = false;
          renderList();
          renderDetail();
          renderSuggestions();
          root.querySelector(".sg-search-input")?.focus();
          return created;
        }

        async function saveName(input) {
          const s = selected();
          const name = input.value.trim();
          if (!s) return;
          if (!name) {
            input.value = s.name;
            return;
          }
          if (name === s.name) return;
          await refresh(await window.electronAPI.renameSaga(s.id, name));
          renderList();
          renderResults();
        }

        function bind() {
          root.querySelector(".sg-new").addEventListener("submit", (e) => {
            e.preventDefault();
            const input = root.querySelector(".sg-new-input");
            const name = input.value.trim();
            if (!name) return input.focus();
            input.value = "";
            run(() => createSaga(name));
          });

          root.addEventListener("click", (e) => {
            const item = e.target.closest(".sg-item");
            if (item && item.dataset.id !== selectedId) {
              selectedId = item.dataset.id;
              query = "";
              confirmingDelete = false;
              renderList();
              renderDetail();
              return;
            }

            const btn = e.target.closest("[data-act]");
            if (!btn) return;
            const s = selected();
            const act = btn.dataset.act;

            if (act === "sug-yes" || act === "sug-no") {
              const sug = suggestions?.[Number(btn.dataset.idx)];
              if (!sug) return;
              suggestions = suggestions.filter((x) => x !== sug);
              if (act === "sug-no") {
                window.electronAPI.dismissSagaSuggestion(sug.name);
                renderSuggestions();
                return;
              }
              // Se crea vacía: sus juegos salen abajo como sugerencias.
              run(async () => {
                const before = new Set(sagas.map((x) => x.id));
                await refresh(await window.electronAPI.createSaga(sug.name));
                const created = sagas.find((x) => !before.has(x.id));
                if (created) {
                  suggestedFor.set(created.id, sug.gameIds.map(Number));
                  selectedId = created.id;
                }
                query = "";
                confirmingDelete = false;
                renderList();
                renderDetail();
                renderSuggestions();
              });
              return;
            }

            if (act === "add") {
              btn.classList.add("is-adding");
              run(async () => {
                await refresh(await window.electronAPI.addGameToSaga(s.id, btn.dataset.gid));
                renderList();
                renderGames();
                renderResults();
              });
            } else if (act === "remove") {
              run(async () => {
                await refresh(await window.electronAPI.removeGameFromSaga(s.id, btn.dataset.gid));
                renderList();
                renderGames();
                renderResults();
              });
            } else if (act === "sort") {
              btn.classList.add("is-loading");
              run(async () => {
                await refresh(await window.electronAPI.sortSagaByRelease(s.id));
                renderList();
                renderGames();
                showNotification(`"${s.name}" ordenada por fecha de lanzamiento.`);
              });
            } else if (act === "del") {
              confirmingDelete = true;
              renderDetail();
            } else if (act === "del-no") {
              confirmingDelete = false;
              renderDetail();
            } else if (act === "del-yes") {
              run(async () => {
                await window.electronAPI.deleteSaga(s.id);
                confirmingDelete = false;
                query = "";
                await refresh();
                renderList();
                renderDetail();
                showNotification(`Saga "${s.name}" eliminada.`);
              });
            }
          });

          root.addEventListener("input", (e) => {
            if (e.target.matches(".sg-search-input")) {
              query = e.target.value;
              renderResults();
            }
          });

          root.addEventListener("keydown", (e) => {
            if (e.target.matches(".sg-name") && (e.key === "Enter" || e.key === "Escape")) {
              if (e.key === "Escape") e.target.value = selected()?.name || "";
              e.preventDefault();
              e.stopPropagation();
              e.target.blur();
            }
          });

          root.addEventListener("focusout", (e) => {
            if (e.target.matches(".sg-name")) run(() => saveName(e.target));
          });

          // Arrastrar y soltar: juegos dentro de la saga y sagas en la lista.
          // Se mueve el elemento en vivo y al soltar se guarda el orden que
          // haya quedado en pantalla.
          let dragEl = null;
          root.addEventListener("dragstart", (e) => {
            const el = e.target.closest?.(".sg-game, .sg-item");
            if (!el) return;
            dragEl = el;
            el.classList.add("is-dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", "");
          });
          root.addEventListener("dragover", (e) => {
            if (!dragEl) return;
            e.preventDefault();
            const sel = dragEl.classList.contains("sg-game") ? ".sg-game" : ".sg-item";
            const over = e.target.closest?.(sel);
            if (!over || over === dragEl || over.parentNode !== dragEl.parentNode) return;
            const r = over.getBoundingClientRect();
            const after = e.clientY > r.top + r.height / 2;
            over.parentNode.insertBefore(dragEl, after ? over.nextSibling : over);
          });
          root.addEventListener("drop", (e) => e.preventDefault());
          root.addEventListener("dragend", () => {
            if (!dragEl) return;
            const el = dragEl;
            dragEl = null;
            el.classList.remove("is-dragging");
            if (el.classList.contains("sg-game")) {
              const ids = [...root.querySelectorAll(".sg-games .sg-game")].map((li) => Number(li.dataset.gid));
              run(async () => {
                await refresh(await window.electronAPI.setSagaOrder(selectedId, ids));
                renderList();
                renderGames();
              });
            } else {
              const ids = [...root.querySelectorAll(".sg-list .sg-item")].map((li) => li.dataset.id);
              run(async () => {
                await refresh(await window.electronAPI.reorderSagas(ids));
                renderList();
              });
            }
          });
        }

        await openModal({
          eyebrow: "Biblioteca",
          title: "Sagas",
          width: 1000,
          html: `
            <div class="sg-root">
              <aside class="sg-side">
                <form class="sg-new">
                  <input type="text" class="sg-new-input" placeholder="Nueva saga" maxlength="80" aria-label="Nombre de la nueva saga">
                  <button type="submit" class="sl-btn sl-btn-primary sl-btn-sm" title="Crear saga">${icon("plus")}<span>Crear</span></button>
                </form>
                <ul class="sg-list"></ul>
                <p class="sg-side-hint">Arrastra para cambiar el orden.</p>
                <div class="sg-sugs"></div>
              </aside>
              <section class="sg-detail"></section>
            </div>`,
          showConfirmButton: false,
          showCloseButton: true,
          customClass: { popup: "sagas-popup" },
          didOpen: (popup) => {
            root = popup.querySelector(".sg-root");
            renderList();
            renderDetail();
            renderSuggestions();
            bind();
            if (!sagas.length) root.querySelector(".sg-new-input").focus();
            window.electronAPI
              .getSagaSuggestions()
              .catch(() => [])
              .then((list) => {
                suggestions = Array.isArray(list) ? list : [];
                if (root?.isConnected) renderSuggestions();
              });
          },
        });

        await loadLibrary();
      }

      // Atajo desde el menú de una card: elegir saga (o crear una) sin pasar
      // por el gestor completo.
      async function openAddToSagaModal(gameId) {
        const game = [...libraryGamesCache, ...completedGamesCache].find((g) => String(g.id) === String(gameId));
        const sagas = sagasCache;
        let chosen = null;

        await openModal({
          eyebrow: "Añadir a una saga",
          title: game?.name || "Juego",
          width: 460,
          html: `
            <div class="sg-pick">
              ${
                sagas.length
                  ? `<div class="sg-pick-list">
                      ${sagas
                        .map(
                          (s) => `
                        <button type="button" class="sg-pick-item" data-id="${s.id}">
                          ${icon("layers")}
                          <span class="sg-pick-name">${escapeHtml(s.name)}</span>
                          <span class="sg-pick-count">${s.gameIds.length}</span>
                        </button>`
                        )
                        .join("")}
                    </div>
                    <div class="sg-pick-or"><span>o crea una nueva</span></div>`
                  : ""
              }
              <form class="sg-pick-new">
                <input type="text" placeholder="Nombre de la saga" maxlength="80" aria-label="Nombre de la saga">
                <button type="submit" class="sl-btn sl-btn-primary sl-btn-sm">${icon("plus")}<span>Crear y añadir</span></button>
              </form>
            </div>`,
          showConfirmButton: false,
          showCloseButton: true,
          didOpen: (popup) => {
            popup.querySelectorAll(".sg-pick-item").forEach((b) => {
              b.onclick = () => {
                chosen = { id: b.dataset.id };
                Swal.close();
              };
            });
            const form = popup.querySelector(".sg-pick-new");
            form.onsubmit = (e) => {
              e.preventDefault();
              const name = form.querySelector("input").value.trim();
              if (!name) return form.querySelector("input").focus();
              chosen = { name };
              Swal.close();
            };
            if (!sagas.length) form.querySelector("input").focus();
          },
        });

        if (!chosen) return;
        try {
          let saga = sagas.find((s) => s.id === chosen.id);
          if (!saga) {
            const before = new Set(sagas.map((s) => s.id));
            const list = await window.electronAPI.createSaga(chosen.name);
            saga = (list || []).find((s) => !before.has(s.id));
          }
          if (!saga) return;
          await window.electronAPI.addGameToSaga(saga.id, gameId);
          await loadLibrary();
          showNotification(`Añadido a la saga "${saga.name}".`);
        } catch (err) {
          console.error(err);
          showNotification("No se pudo añadir a la saga.", "error");
        }
      }

        const saga = sagaForGame(gameId);
        if (!saga) return;
        await window.electronAPI.removeGameFromSaga(saga.id, gameId);
        await loadLibrary();
        showNotification(`Quitado de la saga "${saga.name}".`);
      }

      async function loadAppVersion() {

      // ===============================
      // Aviso de actualización (esquina inferior derecha)
      // ===============================
      // main.js busca versiones nuevas en segundo plano y solo avisa aquí
      // cuando hay una. Con "Más tarde" el aviso se oculta hasta la próxima
      // versión distinta.
      let updateDismissedVersion = null;

      function renderUpdateToast(state) {
        const el = document.getElementById("updateToast");
        if (!el || !state) return;
        const { status, version, percent = 0 } = state;
        const hidden =
          status === "idle" || (status === "available" && updateDismissedVersion === version);
        if (hidden) {
          el.classList.remove("show");
          return;
        }

        const v = version ? `v${escapeHtml(version)}` : "";
        const views = {
          available: {
            icon: "download",
            title: "Nueva versión disponible",
            text: `La ${v} ya está publicada. ¿Quieres actualizar ahora? La app se reiniciará sola.`,
            actions: `
              <button type="button" class="sl-btn sl-btn-ghost" data-act="later">Más tarde</button>
              <button type="button" class="sl-btn sl-btn-primary" data-act="install">Actualizar</button>`,
          },
          downloading: {
            icon: "download",
            title: `Descargando ${v}`,
            text: `<span class="upd-bar"><span style="width:${percent}%"></span></span><span class="upd-pct">${percent}%</span>`,
          },
          installing: {
            icon: "sparkles",
            title: "Instalando actualización",
            text: "La app se cerrará y volverá a abrirse ya actualizada.",
          },
          error: {
            icon: "alert",
            title: "No se pudo actualizar",
            text: "Revisa la conexión e inténtalo de nuevo.",
            actions: `
              <button type="button" class="sl-btn sl-btn-ghost" data-act="later">Cerrar</button>
              <button type="button" class="sl-btn sl-btn-primary" data-act="install">Reintentar</button>`,
          },
        };
        const view = views[status];
        if (!view) return;

        el.className = `update-toast is-${status} show`;
        el.innerHTML = `
          <span class="upd-icon">${icon(view.icon)}</span>
          <div class="upd-body">
            <p class="upd-title">${view.title}</p>
            <div class="upd-text">${view.text}</div>
            ${status === "available" ? `<button type="button" class="upd-link" data-act="notes">Ver novedades</button>` : ""}
            ${view.actions ? `<div class="upd-actions">${view.actions}</div>` : ""}
          </div>`;

        el.querySelectorAll("[data-act]").forEach((btn) => {
          btn.onclick = () => {
            const act = btn.dataset.act;
            if (act === "install") window.electronAPI.installUpdate();
            if (act === "notes") openChangelogModal();
            if (act === "later") {
              updateDismissedVersion = version;
              el.classList.remove("show");
            }
          };
        });
      }

      function setupUpdateToast() {
        if (!window.electronAPI.onUpdateState) return;
        window.electronAPI.onUpdateState(renderUpdateToast);
        window.electronAPI.getUpdateState().then(renderUpdateToast).catch(() => {});
      }

      async function openChangelogModal() {
        const version = (document.getElementById("versionLink")?.textContent || "").replace(/^v/, "");
        let root = null;

        openModal({
          eyebrow: "Sharingan Launcher",
          title: "Historial de versiones",
          html: `<div class="cl-root"><div class="sl-loading"><span class="sl-spinner"></span></div></div>`,
          showConfirmButton: false,
          showCloseButton: true,
          width: 600,
          didOpen: (popup) => (root = popup.querySelector(".cl-root")),
        });

        let releases = [];
        try {
          releases = (await window.electronAPI.getChangelog()) || [];
        } catch (err) {
          console.error(err);
        }
        if (!root || !root.isConnected) return;

        if (!releases.length) {
          root.innerHTML = `<p class="sl-hint cl-empty">No se ha podido cargar el historial (necesita conexión a internet).</p>`;
          return;
        }

        root.innerHTML = releases
          .map((r) => {
            const date = r.publishedAt
              ? new Date(r.publishedAt).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" })
              : "";
            const isCurrent = version && String(r.tag || "").replace(/^v/, "") === version;
            const lines = (r.body || "")
              .split("\n")
              .map((l) => l.trim())
              .filter((l) => l && !/^#+\s/.test(l))
              .map((l) => `<li>${escapeHtml(l.replace(/^[-*]\s*/, ""))}</li>`)
              .join("");
            return `
            <article class="cl-release ${isCurrent ? "is-current" : ""}">
              <header class="cl-head">
                <span class="cl-name">${escapeHtml(r.name)}</span>
                ${isCurrent ? `<span class="cl-badge">Instalada</span>` : ""}
                <span class="cl-date">${date}</span>
              </header>
              ${lines ? `<ul class="cl-list">${lines}</ul>` : ""}
            </article>`;
          })
          .join("");
      }

      async function loadAppSettings() {
        try {
          const settings = (await window.electronAPI.getSettings()) || {};
          if (settings.gamesPerPage) DISCOVER_PAGE_SIZE = settings.gamesPerPage;
          applyGridColumns(settings.gridColumns);
          applyTheme(settings.theme);

          console.error("No se pudieron cargar los ajustes", err);
        }

      function applyGridColumns(value) {
        if (!value) return;
        document.documentElement.style.setProperty("--grid-cols", value);
        // Los bloques de saga calculan su ancho en columnas al pintarse.
        if (document.querySelector(".saga-group")) {
          applyLibraryFilter();
          renderCompletedList();
        }
      }

      function applyTheme(themeId) {
        if (!themeId || themeId === "uchiha") {
          document.documentElement.removeAttribute("data-theme");
        } else {
          document.documentElement.setAttribute("data-theme", themeId);
        }
      }

      // Cada ajuste se aplica y se guarda al momento (como un panel de
      // ajustes de Linear/Notion) - no hay Guardar/Cancelar, solo cerrar
      // con la × o Esc, porque no queda nada pendiente de confirmar.
      async function persistSetting(patch) {
        try {
          return await window.electronAPI.setSettings(patch);
        } catch (err) {
          console.error("No se pudo guardar el ajuste", err);
        }
      }

              <div class="settings-section">

          didOpen: () => {

      // ===============================
      // Borrar todos los datos
      // ===============================
      async function wipeAllData() {
        const ok = await confirmDialog({
          title: "¿Borrar todos los datos?",
          text: "Se borrarán tu biblioteca, los juegos pasados, los platinos y todas las sagas. No se puede deshacer.",
          confirmText: "Borrar todo",

        });

        try {
          await window.electronAPI.clearAllData();
          await loadLibrary();
          await loadDiscoverGames();

        } catch (err) {
          console.error(err);
          showNotification("No se pudieron borrar los datos.", "error");
        }
      }

      // ===============================
      // Copia de partidas
      // ===============================
      // 1) main.js busca dónde guarda partidas cada juego (manifiesto de
      //    Ludusavi), 2) se elige de cuáles hacer copia y dónde (por defecto
      //    Documentos o la última carpeta usada), 3) se copian y se enseña de
      //    cuáles se ha podido y de cuáles no.
      function formatSize(bytes) {
        if (!bytes) return "0 KB";
        const units = ["B", "KB", "MB", "GB"];
        let i = 0;
        let n = bytes;
        while (n >= 1024 && i < units.length - 1) {
          n /= 1024;
          i++;
        }
        return `${n.toLocaleString("es-ES", { maximumFractionDigits: n < 10 && i > 0 ? 1 : 0 })} ${units[i]}`;
      }

      window.electronAPI.onBackupProgress?.((p) => {
        const el = document.getElementById("slLoadingText");
        if (el && p?.name) el.textContent = `${p.done + 1} de ${p.total}: ${p.name}`;
      });

      async function openBackupModal() {
        loadingModal(
          "Buscando partidas guardadas",
          "La primera vez descarga la base de datos de rutas de guardado (unos 17 MB)."
        );
        let scan;
        try {
          scan = await window.electronAPI.scanSaves();
        } catch (err) {
          scan = { ok: false, error: err.message };
        }
        if (!scan?.ok) {
          await openModal({
            width: 440,
            html: `<div class="sl-confirm"><span class="sl-confirm-icon is-danger">${icon("alert")}</span>
              <h3 class="sl-confirm-title">No se pudo buscar</h3><p class="sl-confirm-text">${escapeHtml(scan?.error || "Error desconocido.")}</p></div>`,
            confirmButtonText: "Cerrar",
            customClass: { popup: "sl-modal-sm" },
          });
          return;
        }

        const owned = new Map([...libraryGamesCache, ...completedGamesCache].map((g) => [String(g.id), g]));
        const found = scan.games.filter((g) => g.count > 0).sort((a, b) => a.name.localeCompare(b.name, "es"));
        const missing = scan.games.filter((g) => g.count === 0).sort((a, b) => a.name.localeCompare(b.name, "es"));
        let dir = scan.dir;

        if (!scan.games.length) {
          await openModal({
            width: 440,
            html: `<div class="sl-confirm"><span class="sl-confirm-icon">${icon("save")}</span>
              <h3 class="sl-confirm-title">No tienes juegos</h3><p class="sl-confirm-text">Añade o importa juegos a tu biblioteca para poder hacer copia de sus partidas.</p></div>`,
            confirmButtonText: "Entendido",
            customClass: { popup: "sl-modal-sm" },
          });
          return;
        }

        const row = (g, enabled) => `
          <label class="bk-row ${enabled ? "" : "is-off"}">
            <input type="checkbox" class="bk-check" value="${escapeHtml(String(g.id))}" ${enabled ? "checked" : "disabled"}>
            <img src="${coverOf(owned.get(String(g.id)))}" alt="">
            <span class="bk-name">${escapeHtml(g.name)}</span>
            <span class="bk-meta">${enabled ? formatSize(g.size) : "Sin partidas localizadas"}</span>
          </label>`;

        const { isConfirmed, value } = await openModal({
          eyebrow: "Datos",
          title: "Copia de partidas",
          width: 620,
          html: `
            <div class="bk-root">
              ${
                found.length
                  ? `<div class="bk-toolbar">
                      <span class="bk-count">${found.length} ${found.length === 1 ? "juego" : "juegos"} con partidas</span>
                      <button type="button" class="sl-btn sl-btn-ghost sl-btn-sm" data-bk="all">Seleccionar todo</button>
                      <button type="button" class="sl-btn sl-btn-ghost sl-btn-sm" data-bk="none">Deseleccionar todo</button>
                    </div>
                    <div class="bk-list">${found.map((g) => row(g, true)).join("")}</div>`
                  : `<p class="sl-hint">No se han encontrado partidas guardadas de ninguno de tus juegos en este equipo.</p>`
              }
              ${
                missing.length
                  ? `<details class="bk-missing"><summary>Sin partidas localizadas (${missing.length})</summary>
                      <div class="bk-list">${missing.map((g) => row(g, false)).join("")}</div></details>`
                  : ""
              }
              <div class="bk-dest">
                <span class="bk-dest-label">Guardar en</span>
                <span class="bk-dest-path" title="${escapeHtml(dir)}">${escapeHtml(dir)}</span>
                <button type="button" class="sl-btn sl-btn-ghost sl-btn-sm" data-bk="dir">${icon("folderOpen")}Cambiar</button>
              </div>
            </div>`,
          showCancelButton: true,
          showConfirmButton: found.length > 0,
          confirmButtonText: "Hacer copia",
          cancelButtonText: found.length ? "Cancelar" : "Cerrar",
          customClass: { popup: "bk-popup" },
          didOpen: (popup) => {
            const checks = () => [...popup.querySelectorAll(".bk-list .bk-check:not(:disabled)")];
            const sync = () => {
              const n = checks().filter((c) => c.checked).length;
              const btn = Swal.getConfirmButton();
              if (btn) {
                btn.textContent = n ? `Hacer copia (${n})` : "Hacer copia";
                btn.disabled = n === 0;
              }
            };
            popup.addEventListener("change", (e) => e.target.matches(".bk-check") && sync());
            popup.addEventListener("click", async (e) => {
              const b = e.target.closest("[data-bk]");
              if (!b) return;
              if (b.dataset.bk === "all") checks().forEach((c) => (c.checked = true));
              if (b.dataset.bk === "none") checks().forEach((c) => (c.checked = false));
              if (b.dataset.bk === "dir") {
                const chosen = await window.electronAPI.chooseBackupDir(dir);
                if (chosen) {
                  dir = chosen;
                  const p = popup.querySelector(".bk-dest-path");
                  p.textContent = dir;
                  p.title = dir;
                }
              }
              sync();
            });
            sync();
          },
          preConfirm: () => [...document.querySelectorAll(".bk-list .bk-check:checked")].map((c) => c.value),
        });
        if (!isConfirmed || !value?.length) return;

        loadingModal("Copiando partidas", "Preparando…");
        let res;
        try {
          res = await window.electronAPI.backupSaves(value, dir);
        } catch (err) {
          res = { ok: false, error: err.message };
        }
        if (!res?.ok) {
          await openModal({
            width: 440,
            html: `<div class="sl-confirm"><span class="sl-confirm-icon is-danger">${icon("alert")}</span>
              <h3 class="sl-confirm-title">No se pudo hacer la copia</h3><p class="sl-confirm-text">${escapeHtml(res?.error || "")}</p></div>`,
            confirmButtonText: "Cerrar",
            customClass: { popup: "sl-modal-sm" },
          });
          return;
        }

        const ok = res.results.filter((r) => r.ok);
        const ko = res.results.filter((r) => !r.ok);
        const { isDenied } = await openModal({
          eyebrow: "Copia de partidas",
          title: ko.length ? "Copia terminada con avisos" : "Copia terminada",
          width: 560,
          html: `
            <div class="bk-result">
              <p class="bk-result-dir">${icon("folderOpen")}<span>${escapeHtml(res.dir)}</span></p>
              ${
                ok.length
                  ? `<p class="bk-result-title is-ok">${icon("checkCircle")}Copiados (${ok.length})</p>
                     <ul class="bk-result-list">${ok
                       .map(
                         (r) =>
                           `<li><span>${escapeHtml(r.name)}</span><span class="bk-meta">${formatSize(r.size)}${r.partial ? " · algún archivo en uso no se copió" : ""}</span></li>`
                       )
                       .join("")}</ul>`
                  : ""
              }
              ${
                ko.length
                  ? `<p class="bk-result-title is-ko">${icon("xCircle")}Sin copia (${ko.length})</p>
                     <ul class="bk-result-list">${ko
                       .map((r) => `<li><span>${escapeHtml(r.name)}</span><span class="bk-meta">${escapeHtml(r.error)}</span></li>`)
                       .join("")}</ul>`
                  : ""
              }
              ${
                missing.length
                  ? `<p class="sl-hint">Además, ${missing.length} ${missing.length === 1 ? "juego no tenía" : "juegos no tenían"} partidas localizadas en este equipo.</p>`
                  : ""
              }
            </div>`,
          confirmButtonText: "Cerrar",
          showDenyButton: ok.length > 0,
          denyButtonText: "Abrir carpeta",
          customClass: { popup: "bk-popup" },
        });
        if (isDenied) window.electronAPI.openBackupDir(res.dir);
      }

      // ===============================
      // Importar juegos instalados
      // ===============================
      // Al pulsar se busca todo solo (Steam, Epic y GOG se localizan por el
      // registro de Windows) y después se enseña qué se ha encontrado. Solo
      // se pide una carpeta para lo que no se haya encontrado o haya fallado,
      // y el .exe de los juegos que no se sepa cómo lanzar.
      const IMPORT_PLATFORMS = {
        steam: {
          label: "Steam",
          key: "steamRoot",
          pickTitle: "Carpeta de Steam o de una biblioteca de Steam (p. ej. D:\\SteamLibrary)",
          notFound: "No se ha encontrado Steam en este equipo.",
        },
        epic: {
          label: "Epic Games",
          key: "epicManifestsDir",
          pickTitle: "Carpeta Manifests de Epic (C:\\ProgramData\\Epic\\EpicGamesLauncher\\Data\\Manifests)",
          notFound: "No se ha encontrado Epic Games Launcher.",
        },
        gog: {
          label: "GOG",
          key: "gogRoot",
          pickTitle: "Carpeta donde instalas los juegos de GOG",
          notFound: "No se ha encontrado GOG Galaxy ni la carpeta C:\\GOG Games.",
        },
        none: {
          label: "Sin launcher",
          key: "noneRoot",
          pickTitle: "Carpeta con tus juegos sin launcher (una subcarpeta por juego)",
          notFound: "",
        },
      };

      let enrichingCovers = false;
      async function enrichCoversInBackground() {
        if (enrichingCovers) return;
        enrichingCovers = true;
        try {
          const r = await window.electronAPI.enrichCovers({ limit: 80 });
          if (r?.updated) await loadLibrary();
        } catch (err) {
          console.error(err);
        } finally {
          enrichingCovers = false;
        }
      }

      async function openImportModal() {
        loadingModal("Buscando juegos instalados", "Steam, Epic Games y GOG");

        let report;
        try {
          report = (await window.electronAPI.importInstalledGames({}))?.report || {};
        } catch (err) {
          console.error(err);
          const retry = await confirmDialog({
            title: "No se ha podido completar la búsqueda",
            text: String(err?.message || err),
            confirmText: "Reintentar",
            iconName: "alert",
          });
          if (retry) openImportModal();
          return;
        }

        await loadLibrary();
        refreshSearchUI();
        enrichCoversInBackground();
        showImportResults(report);
      }

      function mergeImportReport(prev, next) {
        if (next.status !== "ok") {
          if (prev?.status === "ok") {
            showNotification(next.error || "No se encontró nada en esa carpeta.", "error");
            return prev;
          }
          return next;
        }
        if (!prev || prev.status !== "ok") return next;
        return {
          status: "ok",
          location: next.location,
          added: [...prev.added, ...next.added],
          existing: prev.existing + next.existing,
          noLaunch: [...prev.noLaunch, ...next.noLaunch.filter((n) => !prev.noLaunch.some((p) => p.id === n.id))],
          error: null,
        };
      }

      function showImportResults(report) {
        const linked = new Set();
        let root = null;
        let busy = false;

        function rowHtml(key) {
          const p = IMPORT_PLATFORMS[key];
          const r = report[key];
          if (!r) return "";

          let state, iconName, text;
          if (r.status === "ok") {
            const n = r.added.length;
            state = "ok";
            iconName = "checkCircle";
            text = n ? `${n} ${n === 1 ? "juego nuevo" : "juegos nuevos"}` : "Sin juegos nuevos";
            if (r.existing) text += ` · ${r.existing} ya ${r.existing === 1 ? "estaba" : "estaban"} en tu biblioteca`;
            if (!n && !r.existing) {
              state = "warn";
              iconName = "alert";
              text = "Encontrado, pero sin juegos instalados.";
            }
          } else if (r.status === "error") {
            state = "error";
            iconName = "xCircle";
            text = r.error || "No se ha podido leer.";
          } else {
            state = "missing";
            iconName = "searchX";
            text = p.notFound;
          }

          const needsAction = state === "missing" || state === "error";
          return `
            <div class="imp-row is-${state}" data-key="${key}">
              <span class="imp-row-icon">${icon(iconName)}</span>
              <div class="imp-row-text">
                <span class="imp-row-name">${p.label}</span>
                <span class="imp-row-detail">${escapeHtml(text)}</span>
                ${r.location && r.status === "ok" ? `<span class="imp-row-path">${escapeHtml(r.location)}</span>` : ""}
                ${
                  r.added.length
                    ? `<details class="imp-added"><summary>Ver juegos nuevos</summary><p>${r.added.map(escapeHtml).join(", ")}</p></details>`
                    : ""
                }
              </div>
              <button type="button" class="sl-btn ${needsAction ? "sl-btn-primary" : "sl-btn-ghost"} sl-btn-sm" data-pick="${key}" title="${escapeHtml(p.pickTitle)}">
                ${icon(needsAction ? "folderOpen" : "folderPlus")}<span>${needsAction ? "Indicar carpeta" : "Otra carpeta"}</span>
              </button>
            </div>`;
        }

        function noLaunchHtml() {
          const list = Object.values(report)
            .flatMap((r) => r?.noLaunch || [])
            .filter((g) => !linked.has(String(g.id)));
          if (!list.length) return "";
          return `
            <div class="imp-nolaunch">
              <div class="imp-section-title">${icon("alert")}Falta el ejecutable de ${list.length === 1 ? "1 juego" : `${list.length} juegos`}</div>
              <p class="sl-hint">Ya están en tu biblioteca, pero no se ha encontrado cómo lanzarlos. Elige su .exe ahora o más tarde desde su card.</p>
              ${list
                .map(
                  (g) => `
                <div class="imp-nl-row">
                  <span>${escapeHtml(g.name)}</span>
                  <button type="button" class="sl-btn sl-btn-ghost sl-btn-sm" data-link="${g.id}">${icon("link")}<span>Elegir .exe</span></button>
                </div>`
                )
                .join("")}
            </div>`;
        }

        function render() {
          const reps = Object.values(report).filter(Boolean);
          const added = reps.reduce((n, r) => n + (r.added?.length || 0), 0);
          const existing = reps.reduce((n, r) => n + (r.existing || 0), 0);
          const pending = reps.some((r) => r.status !== "ok");

          root.innerHTML = `
            <div class="imp-summary">
              <span class="imp-summary-num">${added}</span>
              <div>
                <span class="imp-summary-title">${added === 1 ? "juego importado" : "juegos importados"}</span>
                <span class="imp-summary-sub">${
                  [existing ? `${existing} ya estaban en tu biblioteca` : null, pending ? "Revisa abajo lo que no se ha encontrado" : null]
                    .filter(Boolean)
                    .join(" · ") || "Todo encontrado"
                }</span>
              </div>
            </div>
            <div class="imp-rows">${["steam", "epic", "gog", "none"].map(rowHtml).join("")}</div>
            ${noLaunchHtml()}
            <button type="button" class="imp-add-none" data-pick="none">
              ${icon("folderPlus")}
              <span>
                <b>Añadir una carpeta de juegos sin launcher</b>
                <small>Juegos que no son de Steam, Epic ni GOG, con una subcarpeta por juego.</small>
              </span>
            </button>`;
        }

        async function pick(key) {
          const p = IMPORT_PLATFORMS[key];
          const res = await window.electronAPI.openDirectoryDialog({ title: p.pickTitle });
          if (res.canceled || !res.dirPath) return;

          root.querySelector(`.imp-row[data-key="${key}"]`)?.classList.add("is-loading");
          const out = await window.electronAPI.importInstalledGames({ platforms: [key], [p.key]: res.dirPath });
          const next = out?.report?.[key];
          if (next) report[key] = mergeImportReport(report[key], next);
          render();
          await loadLibrary();
          refreshSearchUI();
          enrichCoversInBackground();
        }

        async function link(id) {
          const res = await window.electronAPI.openFileDialog();
          if (res.canceled) return;
          await window.electronAPI.setExecutable(id, { path: res.filePath });
          linked.add(String(id));
          render();
          await loadLibrary();
        }

        openModal({
          eyebrow: "Importar",
          title: "Juegos instalados",
          width: 640,
          html: `<div class="imp-root"></div>`,
          confirmButtonText: "Listo",
          showCloseButton: true,
          customClass: { popup: "import-popup" },
          didOpen: (popup) => {
            root = popup.querySelector(".imp-root");
            render();
            root.addEventListener("click", async (e) => {
              const b = e.target.closest("[data-pick], [data-link]");
              if (!b || busy) return;
              busy = true;
              root.classList.add("is-busy");
              try {
                if (b.dataset.pick) await pick(b.dataset.pick);
                else await link(b.dataset.link);
              } catch (err) {
                console.error(err);
                showNotification("No se pudo completar la acción.", "error");
                render();
              } finally {
                busy = false;
                root.classList.remove("is-busy");
              }
            });
          },
        });
      }

      // ===============================
      // GAMEPAD: foco + acciones
      // ===============================
      function setupGamepad() {
        window.addEventListener("gamepadconnected", (e) => {
          activePadIndex = e.gamepad.index;
          showNotification(`Mando conectado`, "success");
        });

        window.addEventListener("gamepaddisconnected", (e) => {
          if (activePadIndex === e.gamepad.index) activePadIndex = null;
          showNotification(`Mando desconectado`, "error");
        });

        requestAnimationFrame(tickGamepad);
      }

      function getPad() {
        const pads = navigator.getGamepads?.() || [];
        if (activePadIndex != null && pads[activePadIndex])
          return pads[activePadIndex];
        return pads.find(Boolean) || null;
      }

      function edge(now, key) {
        const fired = now && !gpLast[key];
        gpLast[key] = now;
        return fired;
      }

      function getCardsInActiveGrid() {
        const secId = getActiveSectionId();
        if (secId === "popular")
          return Array.from(document.querySelectorAll("#gamesList .game-card"));
        if (secId === "library")
          return Array.from(
            document.querySelectorAll("#libraryList .game-card")
          );
        if (secId === "completed")
          return Array.from(
            document.querySelectorAll("#completedList .game-card")
          );
        return [];
      }

      function updateGamepadFocus(force = false) {
        const cards = getCardsInActiveGrid();
        cards.forEach((c) => c.classList.remove("gp-focused"));

        if (cards.length === 0) return;

        if (focusedIndex < 0) focusedIndex = 0;
        if (focusedIndex >= cards.length) focusedIndex = cards.length - 1;

        const focused = cards[focusedIndex];
        if (focused) {
          focused.classList.add("gp-focused");
          focused.scrollIntoView({
            block: "nearest",
            inline: "nearest",
            behavior: force ? "auto" : "smooth",
          });
        }
      }

      function getGridColumns() {
        const w = window.innerWidth;
        if (w <= 700) return 2;
        if (w <= 1000) return 3;
        if (w <= 1400) return 4;
        return 6;
      }

      function clickPrimaryActionOnFocused() {
        const cards = getCardsInActiveGrid();
        const card = cards[focusedIndex];
        if (!card) return;

        // Prioridad: botón primary (Jugar/Agregar)
        const primary = card.querySelector("button.primary");
        if (primary) return primary.click();

        // Si no hay primary, click al primer button normal
        const anyBtn = card.querySelector("button");
        if (anyBtn) return anyBtn.click();
      }

      function backAction() {
        const popup = Swal.getPopup?.();
        if (popup) {
          Swal.close();
          return;
        }

        // Volver a biblioteca como acción "atrás" sencilla
        showSection(
          "library",
          document.querySelectorAll(".topnav-item")[1]
        );
      }

      function switchSection(delta) {
        const items = Array.from(document.querySelectorAll(".topnav-item"));
        const activeIdx = items.findIndex((li) =>
          li.classList.contains("active")
        );
        if (activeIdx < 0) return;
        let next = activeIdx + delta;
        if (next < 0) next = items.length - 1;
        if (next >= items.length) next = 0;
        items[next].click();
      }

      function tickGamepad() {
        const gp = getPad();

        if (gp) {
          const up = !!gp.buttons[12]?.pressed || (gp.axes?.[1] ?? 0) < -0.6;
          const down = !!gp.buttons[13]?.pressed || (gp.axes?.[1] ?? 0) > 0.6;
          const left = !!gp.buttons[14]?.pressed || (gp.axes?.[0] ?? 0) < -0.6;
          const right = !!gp.buttons[15]?.pressed || (gp.axes?.[0] ?? 0) > 0.6;

          const a = !!gp.buttons[0]?.pressed; // A / Cross
          const b = !!gp.buttons[1]?.pressed; // B / Circle
          const x = !!gp.buttons[2]?.pressed;
          const y = !!gp.buttons[3]?.pressed;
          const lb = !!gp.buttons[4]?.pressed;
          const rb = !!gp.buttons[5]?.pressed;

          const cols = getGridColumns();

          if (edge(up, "up")) {
            focusedIndex -= cols;
            updateGamepadFocus();
          }
          if (edge(down, "down")) {
            focusedIndex += cols;
            updateGamepadFocus();
          }
          if (edge(left, "left")) {
            focusedIndex -= 1;
            updateGamepadFocus();
          }
          if (edge(right, "right")) {
            focusedIndex += 1;
            updateGamepadFocus();
          }

          if (edge(a, "a")) clickPrimaryActionOnFocused();
          if (edge(b, "b")) backAction();

          if (edge(lb, "lb")) switchSection(-1);
          if (edge(rb, "rb")) switchSection(+1);

          if (edge(x, "x")) {
            if (getActiveSectionId() === "library") toggleLinkedFilter();
          }

          if (edge(y, "y")) {
            if (getActiveSectionId() === "popular") {
              document.getElementById("searchInput")?.focus();
            }
          }
        }

        requestAnimationFrame(tickGamepad);
      }
    </script>
  </body>
</html>
