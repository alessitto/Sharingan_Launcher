<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sharingan Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <audio id="easter-audio" src="assets/dartacan.mp3" preload="auto"></audio>

    <!-- Pantalla de Intro -->
    <div id="intro-screen">
      <div class="intro-content">
        <img src="assets/icon.png" alt="Logo" class="intro-logo" />
        <h1 class="intro-title">Sharingan Launcher</h1>
      </div>
      <audio id="intro-audio" src="assets/intro.mp3"></audio>
    </div>

    <div id="notification-container"></div>

    <div class="app">
      <!-- Navegación superior -->
      <nav class="topnav">
        <span class="topnav-title">Sharingan Launcher</span>
        <div class="topnav-item active" onclick="showSection('popular', this)">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          Descubrir
        </div>
        <div class="topnav-item" onclick="showSection('library', this)">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Mi biblioteca
        </div>
        <div class="topnav-item" onclick="showSection('completed', this)">
          <svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a2 2 0 0 0 0 4h1"/><path d="M17 6h3a2 2 0 0 1 0 4h-1"/></svg>
          Juegos pasados
        </div>
      </nav>

      <!-- Contenido principal -->
      <main class="main-content">
        <!-- Populares / búsqueda -->
        <section id="popular" class="section active">
          <h2 class="section-title">Descubrir</h2>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar juegos..."
            oninput="onSearchInput()"
          />
          <div class="discover-toolbar">
            <select id="genreFilter" onchange="loadDiscoverGames()">
              <option value="">Todos los géneros</option>
            </select>
            <select id="sortFilter" onchange="loadDiscoverGames()">
              <option value="popular">Más popular</option>
              <option value="az">Nombre A-Z</option>
              <option value="za">Nombre Z-A</option>
              <option value="year_desc">Año: más reciente</option>
              <option value="year_asc">Año: más antiguo</option>
              <option value="upcoming">Próximamente</option>
            </select>
          </div>
          <div id="gamesList" class="cards-grid"></div>
          <div class="load-more-wrap">
            <button id="loadMoreBtn" class="filter-btn" onclick="loadMoreDiscoverGames()" style="display:none;">
              Cargar más
            </button>
          </div>
        </section>

        <!-- Biblioteca -->
        <section id="library" class="section">
          <div class="library-header">
            <h2 class="section-title" id="libraryTitle">Juegos (0)</h2>

            <button
              id="linkedFilterBtn"
              class="filter-btn"
              onclick="toggleLinkedFilter()"
            >
              Vinculados
            </button>

            <button class="filter-btn importBtn" onclick="openImportModal()">
              Importar instalados
            </button>

            <button class="filter-btn" onclick="openSagasModal()">
              Sagas
            </button>
          </div>

          <div id="libraryIndexBar" class="index-bar"></div>

          <div id="libraryList" class="cards-grid"></div>
        </section>

        <!-- Pasados -->
        <section id="completed" class="section">
          <h2 class="section-title">Juegos pasados</h2>
          <div id="completedList" class="cards-grid"></div>
        </section>
      </main>
    </div>

    <script src="node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>

    <script>
      // ===============================
      // Variables globales
      // ===============================
      let gamesTemp = [];
      let libraryIds = new Set();
      let currentSearchGames = [];
      let showOnlyLinked = false;
      let libraryGamesCache = [];
      let completedGamesCache = [];
      let sagasCache = [];
      let dartacanPlayed = false;

      // Gamepad state
      let activePadIndex = null;
      let gpLast = {
        up: false,
        down: false,
        left: false,
        right: false,
        a: false,
        b: false,
        x: false,
        y: false,
        lb: false,
        rb: false,
      };
      let focusedIndex = 0;
      let focusedContainerId = "gamesList"; // cambia según sección

      // Nombres de juegos "sin plataforma" vienen literalmente del nombre de
      // carpeta que elige el usuario — nunca se insertan en innerHTML sin
      // pasar por aquí antes.
      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Botón "Información" reutilizable — en Juegos populares deja ver los
      // requisitos antes de decidir si merece la pena añadirlo.
      function infoButtonHtml(gameId) {
        return `<button class="icon-btn" onclick="openInfoModal('${gameId}')" title="Información" aria-label="Información">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.5" fill="currentColor" stroke-width="1.5"/></svg>
        </button>`;
      }

      // ===============================
      // Navegación lateral
      // ===============================
      function showSection(id, el) {
        document
          .querySelectorAll(".section")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");

        document
          .querySelectorAll(".topnav-item")
          .forEach((li) => li.classList.remove("active"));
        if (el) el.classList.add("active");

        // al cambiar sección, reinicia foco al primer elemento del grid
        if (id === "popular") focusedContainerId = "gamesList";
        if (id === "library") focusedContainerId = "libraryList";
        if (id === "completed") focusedContainerId = "completedList";
        focusedIndex = 0;
        updateGamepadFocus(true);
      }

      function getActiveSectionId() {
        const el = document.querySelector(".section.active");
        return el?.id || "popular";
      }

      // ===============================
      // Carga inicial (UNIFICADA)
      // ===============================
      window.addEventListener("DOMContentLoaded", async () => {
        // filtro biblioteca
        const savedFilter = localStorage.getItem("libraryLinkedFilter");
        showOnlyLinked = savedFilter === "true";

        // intro
        const introScreen = document.getElementById("intro-screen");
        const introAudio = document.getElementById("intro-audio");

        try {
          introAudio.volume = 0.5;
          await introAudio.play();
        } catch (err) {
          console.warn("Audio bloqueado o no encontrado:", err);
        }

        // carga datos
        loadGenreOptions();
        const loadPromises = Promise.all([loadLibrary(), loadDiscoverGames()]);

        setTimeout(async () => {
          await loadPromises;
          introScreen.classList.add("hidden");
          setTimeout(() => introScreen.remove(), 500);

          // foco inicial mando
          focusedContainerId = "gamesList";
          focusedIndex = 0;
          updateGamepadFocus(true);
        }, 2000);

        // gamepad loop
        setupGamepad();
      });

      // Cerrar dropdowns al hacer click fuera
      window.addEventListener("click", (e) => {
        if (!e.target.matches(".more-btn")) {
          document
            .querySelectorAll(".dropdown-content")
            .forEach((d) => d.classList.remove("show"));
        }
      });

      // ===============================
      // Descubrir (populares / búsqueda / filtros) — IGDB
      // ===============================
      let lastSearchTimeout = null;

      function onSearchInput() {
        const q = document.getElementById("searchInput").value.trim();
        // Easter egg: "Dartacan"
        const normalized = q.toLowerCase();
        if (normalized === "dartacan") {
          if (!dartacanPlayed) {
            dartacanPlayed = true;

            const audio = document.getElementById("easter-audio");
            if (audio) {
              audio.currentTime = 0;
              audio.play().catch((err) => {
                console.warn(
                  "No se pudo reproducir el easter egg (autoplay/política):",
                  err
                );
              });
            }
          }
        } else {
          dartacanPlayed = false;
        }
        clearTimeout(lastSearchTimeout);
        lastSearchTimeout = setTimeout(loadDiscoverGames, 350);
      }

      // Carga la lista de géneros de IGDB una vez, para el desplegable.
      async function loadGenreOptions() {
        try {
          const genres = await window.electronAPI.getGenres();
          const select = document.getElementById("genreFilter");
          if (!select || !Array.isArray(genres)) return;
          for (const g of genres) {
            if (!g.name) continue;
            const opt = document.createElement("option");
            opt.value = g.id;
            opt.textContent = g.name;
            select.appendChild(opt);
          }
        } catch (err) {
          console.error("No se pudieron cargar los géneros", err);
        }
      }

      // Punto único: con texto de búsqueda o sin él, con o sin filtros — todo
      // pasa por aquí. Antes había dos funciones casi iguales (populares y
      // búsqueda) que no compartían ni el filtro de género ni el de orden.
      //
      // Paginación: sin búsqueda de texto, main.js pagina de verdad contra
      // IGDB (offset), así que aquí solo se pide la siguiente página. Con
      // búsqueda, main.js trae de una vez el pool completo (hasta 500, el
      // máximo de IGDB) ya ordenado, y aquí se pagina en local sobre ese
      // array sin volver a llamar a la API - así ya no hay tope de 60.
      const DISCOVER_PAGE_SIZE = 60;
      let discoverOffset = 0;
      let discoverHasMore = false;
      let discoverSearchPool = null;
      let discoverSearchShown = 0;

      async function loadDiscoverGames() {
        discoverOffset = 0;
        discoverSearchPool = null;
        discoverSearchShown = 0;
        gamesTemp = [];
        currentSearchGames = [];

        const query = document.getElementById("searchInput")?.value.trim() || "";
        const genreId = document.getElementById("genreFilter")?.value || null;
        const sort = document.getElementById("sortFilter")?.value || "popular";

        const res = await window.electronAPI.discoverGames({ query, genreId, sort, offset: 0 });
        applyDiscoverPage(res, true);
        updateGamepadFocus(true);
      }

      async function loadMoreDiscoverGames() {
        if (discoverSearchPool) {
          const next = discoverSearchPool.slice(
            discoverSearchShown,
            discoverSearchShown + DISCOVER_PAGE_SIZE
          );
          discoverSearchShown += next.length;
          appendDiscoverGames(next);
          updateLoadMoreButton(discoverSearchShown < discoverSearchPool.length);
          return;
        }

        const genreId = document.getElementById("genreFilter")?.value || null;
        const sort = document.getElementById("sortFilter")?.value || "popular";
        discoverOffset += DISCOVER_PAGE_SIZE;

        const res = await window.electronAPI.discoverGames({
          query: "",
          genreId,
          sort,
          offset: discoverOffset,
        });
        applyDiscoverPage(res, false);
      }

      function applyDiscoverPage(res, replace) {
        const items = (res && res.items) || [];

        if (res && res.fullPool) {
          discoverSearchPool = items;
          discoverSearchShown = Math.min(DISCOVER_PAGE_SIZE, items.length);
          const firstPage = items.slice(0, discoverSearchShown);
          gamesTemp = [];
          currentSearchGames = firstPage.slice();
          displayGames("gamesList", firstPage, "add");
          updateLoadMoreButton(discoverSearchShown < items.length);
          return;
        }

        discoverHasMore = !!(res && res.hasMore);
        if (replace) {
          gamesTemp = [];
          currentSearchGames = items.slice();
          displayGames("gamesList", items, "add");
        } else {
          appendDiscoverGames(items);
        }
        updateLoadMoreButton(discoverHasMore);
      }

      function appendDiscoverGames(items) {
        const container = document.getElementById("gamesList");
        if (!container) return;
        currentSearchGames.push(...items);
        items.forEach((game) => container.appendChild(buildDiscoverCard(game)));
      }

      function updateLoadMoreButton(show) {
        const btn = document.getElementById("loadMoreBtn");
        if (btn) btn.style.display = show ? "" : "none";
      }

      // ===============================
      // Biblioteca local
      // ===============================
      async function loadLibrary() {
        let { games, completedGames } = await window.electronAPI.getGames();
        sagasCache = (await window.electronAPI.getSagas()) || [];

        libraryIds.clear();
        if (Array.isArray(games)) games.forEach((g) => libraryIds.add(g.id));
        if (Array.isArray(completedGames))
          completedGames.forEach((g) => libraryIds.add(g.id));

        games = games.slice().sort((a, b) => {
          const ak = (a.sortKey || a.name || "").toString();
          const bk = (b.sortKey || b.name || "").toString();
          return ak.localeCompare(bk, "es", { sensitivity: "base" });
        });

        libraryGamesCache = games;
        completedGamesCache = Array.isArray(completedGames) ? completedGames : [];
        applyLibraryFilter();
        renderCompletedList();
        updateGamepadFocus(true);
      }

      // Busca la saga (si hay) a la que pertenece un juego.
      function sagaForGame(gameId) {
        const gid = Number(gameId);
        return sagasCache.find((s) => s.gameIds.includes(gid));
      }

      // "Juegos pasados" ya no se ordena por nombre: se ordena por fecha de
      // finalización (más reciente arriba). Los juegos de una misma saga no
      // se dispersan por la línea de tiempo — se agrupan en un único bloque,
      // anclado a la fecha en que se completó el PRIMER juego de esa saga
      // (así, si te pasas 2 y 3 mucho después que 1, siguen "arrastrados"
      // junto a 1 en vez de aparecer sueltos por su propia fecha).
      function buildCompletedTimeline(completedGames, sagas) {
        const gameById = new Map(completedGames.map((g) => [g.id, g]));
        const sagaOfGame = new Map();
        sagas.forEach((s) =>
          s.gameIds.forEach((id) => {
            if (!sagaOfGame.has(id)) sagaOfGame.set(id, s);
          })
        );

        const entries = [];
        const consumed = new Set();

        completedGames.forEach((g) => {
          const saga = sagaOfGame.get(g.id);
          if (saga) {
            if (consumed.has(saga.id)) return;
            consumed.add(saga.id);
            const members = saga.gameIds.map((id) => gameById.get(id)).filter(Boolean);
            if (!members.length) return;
            const anchor = Math.min(...members.map((m) => m.completedAt || 0));
            entries.push({ type: "saga", saga, games: members, date: anchor });
          } else {
            entries.push({ type: "game", game: g, date: g.completedAt || 0 });
          }
        });

        entries.sort((a, b) => b.date - a.date);
        return entries;
      }

      function renderCompletedList() {
        const container = document.getElementById("completedList");
        container.innerHTML = "";

        if (!completedGamesCache.length) {
          container.innerHTML = `
            <div class="empty-state">
              <p class="empty-title">Aún no has completado ningún juego.</p>
              <p class="empty-text">Es hora de jugar. Cuando termines un juego podrás marcarlo como pasado.</p>
              <button class="primary" onclick="showSection('library', document.querySelectorAll('.topnav-item')[1])">
                Ir a mi biblioteca
              </button>
            </div>
          `;
          return;
        }

        const entries = buildCompletedTimeline(completedGamesCache, sagasCache);

        entries.forEach((entry) => {
          if (entry.type === "game") {
            container.appendChild(buildGameCard(entry.game, "completed"));
            return;
          }

          const wrap = document.createElement("div");
          wrap.className = "saga-group";

          const header = document.createElement("div");
          header.className = "saga-group-header";
          header.innerHTML = `📚 ${escapeHtml(entry.saga.name)}`;
          wrap.appendChild(header);

          const grid = document.createElement("div");
          grid.className = "saga-group-grid";
          entry.games.forEach((g) => grid.appendChild(buildGameCard(g, "completed")));
          wrap.appendChild(grid);

          container.appendChild(wrap);
        });
      }

      function refreshSearchUI() {
        gamesTemp = [];
        displayGames("gamesList", currentSearchGames, "add");
        updateGamepadFocus(true);
      }

      // ===============================
      // Acciones
      // ===============================
      // Cambia solo el botón de la tarjeta ya en pantalla, sin repintar toda
      // la rejilla (repintarla reseteaba el scroll a arriba del todo).
      function markGameOwnedInGrid(gameId) {
        const card = document.querySelector(
          `#gamesList [data-game-id="${gameId}"] .card-actions`
        );
        if (card) card.innerHTML = `<span class="badge-owned">En tu biblioteca</span>${infoButtonHtml(gameId)}`;
      }

      async function addFromJson(game) {
        try {
          await window.electronAPI.addGame(game);
          await loadLibrary();
          markGameOwnedInGrid(game.id);
          showNotification(
            `"${game.name}" agregado a la biblioteca correctamente.`
          );
        } catch (error) {
          console.error(error);
          showNotification(`Error al agregar "${game.name}".`, "error");
        }
      }

      // Un solo paso: elegir el .exe y listo. La plataforma (Steam/Epic/GOG)
      // se detecta sola por la ruta del ejecutable, solo para mostrarla; no
      // hace falta preguntarla porque un juego vinculado a mano siempre se
      // lanza directamente, no cambia nada en el arranque.
      async function setExecutable(id) {
        try {
          const result = await window.electronAPI.openFileDialog();
          if (result.canceled) return;

          await window.electronAPI.setExecutable(id, { path: result.filePath });
          await loadLibrary();
          refreshSearchUI();
          showNotification("Ejecutable vinculado correctamente");
        } catch (err) {
          console.error(err);
          showNotification("Error al vincular el ejecutable", "error");
        }
      }

      async function launchGame(id) {
        try {
          await window.electronAPI.launchGame(id);
        } catch (error) {
          console.error(error);
          showNotification("Error al iniciar el juego.", "error");
        }
      }

      async function markCompleted(id) {
        await window.electronAPI.markCompleted(id);
        loadLibrary();
      }

      async function returnToLibrary(id) {
        await window.electronAPI.returnToLibrary(id);
        loadLibrary();
      }

      async function removeFromLibrary(id) {
        const { isConfirmed } = await Swal.fire({
          background: "#100e10",
          color: "#f3efe6",
          title: "¿Eliminar de la biblioteca?",
          text: "Esta acción no se puede deshacer.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#bc002d",
          confirmButtonText: "Eliminar",
          cancelButtonText: "Cancelar",
        });
        if (!isConfirmed) return;

        await window.electronAPI.removeGame(Number(id));
        await loadLibrary();
        refreshSearchUI();
        showNotification("Juego eliminado de la biblioteca.");
      }

      function toggleDropdown(e, id) {
        e.stopPropagation();
        document.querySelectorAll(".dropdown-content").forEach((d) => {
          if (d.id !== `dropdown-${id}`) d.classList.remove("show");
        });

        const el = document.getElementById(`dropdown-${id}`);
        if (el) el.classList.toggle("show");
      }

      async function togglePlatinum(id) {
        try {
          await window.electronAPI.togglePlatinum(id);
          await loadLibrary();
        } catch (err) {
          console.error(err);
        }
      }

      // ===============================
      // Modal de Información y Requisitos (BEAUTIFIED)
      // ===============================
      async function openInfoModal(id) {
        // 1. Buscar juego local
        let game = libraryGamesCache.find((g) => String(g.id) === String(id));
        if (!game) {
          const all = await window.electronAPI.getGames();
          game =
            all.games.find((g) => String(g.id) === String(id)) ||
            all.completedGames.find((g) => String(g.id) === String(id));
        }
        // Todavia no esta en la biblioteca (se mira desde Juegos populares):
        // se usa el resultado de la busqueda de IGDB tal cual.
        if (!game) {
          game = currentSearchGames.find((g) => String(g.id) === String(id));
        }
        if (!game) return showNotification("Juego no encontrado", "error");

        // Aviso de carga: los 3 pasos siguientes pueden tardar un poco (sobre
        // todo la primera vez, que Steam descarga su lista completa de apps
        // para la busqueda por nombre), y antes no se veia nada mientras tanto.
        Swal.fire({
          background: "#100e10",
          color: "#f3efe6",
          title: "Cargando información...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        // 2+3+3b. IGDB, requisitos de Steam y specs del equipo: independientes
        // entre si, se piden en paralelo en vez de uno detras de otro.
        const [detailsResult, reqsResult, specsResult] = await Promise.allSettled([
          window.electronAPI.getGameDetails(id),
          window.electronAPI.getRealRequirements({
            igdbId: id,
            steamAppId: game.steamAppId,
            gameName: game.name,
          }),
          window.electronAPI.getSystemSpecs(),
        ]);

        let details = null;
        if (detailsResult.status === "fulfilled" && detailsResult.value?.length > 0) {
          details = detailsResult.value[0];
        } else if (detailsResult.status === "rejected") {
          console.error(detailsResult.reason);
        }

        let reqs = { min: "No disponible", rec: "No disponible" };
        if (reqsResult.status === "fulfilled" && reqsResult.value) {
          reqs = reqsResult.value;
        } else if (reqsResult.status === "rejected") {
          console.error(reqsResult.reason);
        }

        let mySpecs = null;
        if (specsResult.status === "fulfilled") {
          mySpecs = specsResult.value;
        } else {
          console.error(specsResult.reason);
        }

        // --- HELPER: Función para embellecer el texto de Steam ---
        // Comparación numérica fiable contra tu equipo en RAM, VRAM,
        // almacenamiento libre y versión de Windows — son las únicas que se
        // pueden comparar con un número sin ambigüedad. El modelo de CPU/GPU
        // se muestra informativo, sin veredicto: comparar "Core i5-8400" vs
        // "Ryzen 5 3600" de forma fiable necesitaría una base de datos de
        // benchmarks (tipo PassMark) que no tenemos, y un veredicto
        // equivocado ahí es peor que no dar ninguno.
        const extractGb = (str) => {
          const m = str.match(/(\d+(?:[.,]\d+)?)\s*GB/i);
          return m ? parseFloat(m[1].replace(",", ".")) : NaN;
        };
        const extractWinVersion = (str) => {
          const m = str.match(/windows\s*(\d+)/i);
          return m ? parseInt(m[1], 10) : NaN;
        };

        const formatSteamReqs = (text) => {
          if (!text || text.includes("No disponible"))
            return '<p class="req-val" style="opacity:0.5">Información no disponible.</p>';

          const lines = text.split("\n");
          let html = '<div class="req-list">';

          lines.forEach((line) => {
            let cleanLine = line.trim();
            if (!cleanLine) return;

            // Filtros: Quitamos lineas que solo dicen "Minimo" o "Recomendado" porque ya tenemos titulo
            const lower = cleanLine.toLowerCase();
            if (
              lower === "mínimo:" ||
              lower === "recomendado:" ||
              lower === "mínimo" ||
              lower === "recomendado"
            )
              return;

            // Detectar "Clave: Valor"
            // Buscamos el primer ':'
            const splitIdx = cleanLine.indexOf(":");

            if (splitIdx > -1 && splitIdx < 20) {
              // Si hay ':' al principio (ej: "OS: Win10")
              const key = cleanLine.substring(0, splitIdx).trim();
              const val = cleanLine.substring(splitIdx + 1).trim();

              // Limpiar viñetas si las hay
              const cleanKey = key.replace(/•/g, "").trim();
              const safeKey = escapeHtml(cleanKey);
              const safeVal = escapeHtml(val);
              const keyLower = cleanKey.toLowerCase();

              let lineClass = "req-line";
              if (mySpecs) {
                if (/memoria|^ram$/i.test(keyLower)) {
                  const req = extractGb(val);
                  if (!Number.isNaN(req)) {
                    lineClass += mySpecs.ram >= req ? " req-pass" : " req-fail";
                  }
                } else if (/almacenamiento|espacio|storage/i.test(keyLower)) {
                  const req = extractGb(val);
                  if (!Number.isNaN(req) && mySpecs.freeStorage != null) {
                    lineClass += mySpecs.freeStorage >= req ? " req-pass" : " req-fail";
                  }
                } else if (/^so$|^os$|sistema operativo/i.test(keyLower)) {
                  const req = extractWinVersion(val);
                  const mine = extractWinVersion(mySpecs.os || "");
                  if (!Number.isNaN(req) && !Number.isNaN(mine)) {
                    lineClass += mine >= req ? " req-pass" : " req-fail";
                  }
                } else if (/vram/i.test(val) || /vram/i.test(keyLower)) {
                  const req = extractGb(val);
                  if (!Number.isNaN(req) && mySpecs.vram) {
                    lineClass += mySpecs.vram >= req ? " req-pass" : " req-fail";
                  }
                }
              }

              html += `
               <div class="${lineClass}">
                 <span class="req-key">${safeKey}</span>
                 <span class="req-val">${safeVal}</span>
               </div>
             `;
            } else {
              // Es una linea de texto normal o una nota
              html += `
               <div class="req-line">
                 <span class="req-val">${escapeHtml(cleanLine.replace(/•/g, "").trim())}</span>
               </div>
             `;
            }
          });
          html += "</div>";
          return html;
        };

        const mySpecsHtml = mySpecs
          ? `<p class="my-specs">Tu equipo: ${escapeHtml(mySpecs.cpu)} · ${mySpecs.ram} GB RAM · ${escapeHtml(mySpecs.gpu)}${
              mySpecs.freeStorage != null ? ` · ${mySpecs.freeStorage} GB libres` : ""
            }</p>`
          : "";

        // 4. Renderizar
        const coverUrl = details?.cover?.image_id
          ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${details.cover.image_id}.jpg`
          : game.coverUrl || "assets/no-cover.png";
        const genres = details?.genres?.map((g) => g.name).join(", ") || "";

        const html = `
        <div class="info-modal-grid">
          <div><img src="${coverUrl}" class="info-cover"></div>
          <div class="info-details">
             <h3>${escapeHtml(game.name)}</h3>
             <p style="font-size:12px; color:#888;">${escapeHtml(genres)}</p>
             
             <div class="req-real-container">
                <div class="req-box">
                   <h4 class="req-title">MÍNIMOS</h4>
                   ${formatSteamReqs(reqs.min)}
                </div>
                <div class="req-box">
                   <h4 class="req-title">RECOMENDADOS</h4>
                   ${formatSteamReqs(reqs.rec)}
                </div>
             </div>
             
             ${mySpecsHtml}
             <p style="font-size:10px; opacity:0.3; margin-top:10px; text-align:center;">
               Datos provistos por Steam Store API
             </p>
          </div>
        </div>
      `;

        Swal.fire({
          html: html,
          width: 950,
          background: "#100e10",
          color: "#f3efe6",
          showConfirmButton: false,
          showCloseButton: true,
          customClass: { popup: "info-popup" },
        });
      }

      // ===============================
      // Pintar cards reutilizable
      // ===============================
      // Card de un juego "pasado" (completado) — usada tanto para sueltos
      // como para los que van dentro de un bloque de saga.
      function buildGameCard(game, mode) {
        const div = document.createElement("div");
        div.className = "game-card";
        div.dataset.gameId = game.id;

        const name = game.name || "Sin nombre";
        const safeAttrName = name.replace(/"/g, "&quot;");

        const coverUrl =
          game.coverUrl ||
          (game.cover && game.cover.image_id
            ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${game.cover.image_id}.jpg`
            : "assets/no-cover.png");

        const hasExe = !!game.executable;
        const exeStatus = hasExe
          ? `<button class="linked-btn" onclick="confirmUnlink('${game.id}')">Vinculado</button>`
          : `<button onclick="setExecutable('${game.id}')">Vincular</button>`;
        const playButton = hasExe

          : "";

        if (game.isPlatinum) div.classList.add("platinum-card");

        const buttonsHtml = `

               <div class="dropdown-item" onclick="removeFromLibrary('${game.id}')" style="color: #ff6b6b;">Quitar de pasados</div>

          <img src="${coverUrl}" alt="${safeAttrName}">

      // Card de Descubrir ("add"). Aparte porque además de renderizarse en
      // bloque (displayGames) se necesita para ir añadiendo una a una al
      // pulsar "Cargar más", sin repintar lo que ya había.
      function buildDiscoverCard(game) {
        const div = document.createElement("div");
        div.className = "game-card";
        div.dataset.gameId = game.id;

        const name = game.name || "Sin nombre";
        const safeAttrName = name.replace(/"/g, "&quot;");

          game.coverUrl ||
          (game.cover && game.cover.image_id
            ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${game.cover.image_id}.jpg`
            : "assets/no-cover.png");

        const index = gamesTemp.length;
        gamesTemp.push(game);

        const buttonsHtml = libraryIds.has(game.id)

          : `<button class="primary add-btn" data-index='${index}'>Agregar a biblioteca</button>${infoButtonHtml(game.id)}`;

        div.innerHTML = `
          <img src="${coverUrl}" alt="${safeAttrName}">
          <h3>${escapeHtml(name)}</h3>
          <div class="card-actions">${buttonsHtml}</div>
        `;

        return div;
      }

      // Cubetas del índice A-Z de la biblioteca: símbolos, números y letras
      // (con la Ñ en su sitio, como en cualquier listado en español).
      const LIBRARY_INDEX_BUCKETS = [
        "#", "0-9", "A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L",
        "M", "N", "Ñ", "O", "P", "Q", "R", "S", "T", "U", "V", "W", "X", "Y", "Z",
      ];

      function letterBucket(str) {
        const s = (str || "").trim();
        if (!s) return "#";
        const ch = s[0].toUpperCase();
        if (ch === "Ñ") return "Ñ";
        if (/[A-Z]/.test(ch)) return ch;
        if (/[0-9]/.test(ch)) return "0-9";
        return "#";
      }

      function renderLibraryIndexBar(gamesShown) {
        const bar = document.getElementById("libraryIndexBar");
        if (!bar) return;

        const present = new Set(gamesShown.map((g) => letterBucket(g.sortKey || g.name)));
        bar.innerHTML = LIBRARY_INDEX_BUCKETS.map((b) => {
          const has = present.has(b);
          return `<button type="button" class="index-btn" data-bucket="${b}" ${has ? "" : "disabled"}>${b}</button>`;
        }).join("");

        bar.querySelectorAll(".index-btn:not([disabled])").forEach((btn) => {
          btn.onclick = () => {
            const target = document.querySelector(
              `#libraryList [data-letter="${CSS.escape(btn.dataset.bucket)}"]`
            );
            if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
          };
        });
      }

      function displayGames(containerId, games, mode) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (!Array.isArray(games)) return;

        if (games.length === 0) {
          if (mode === "library") {
            container.innerHTML = `
            <div class="empty-state">
              <p class="empty-title">Todavía no tienes juegos en tu biblioteca.</p>
              <p class="empty-text">Busca juegos en la sección de populares y añádelos a tu biblioteca.</p>
              <button class="primary" onclick="showSection('popular', document.querySelectorAll('.topnav-item')[0])">
                Buscar juegos
              </button>
            </div>
          `;
            return;
          }

        }

        if (mode === "add") {
          games.forEach((game) => container.appendChild(buildDiscoverCard(game)));
          return;
        }

        games.forEach((game) => {
          const div = document.createElement("div");
          div.className = "game-card";
          div.dataset.gameId = game.id;
          div.dataset.letter = letterBucket(game.sortKey || game.name);

          const name = game.name || "Sin nombre";
          const safeAttrName = name.replace(/"/g, "&quot;");

          const coverUrl =
            game.coverUrl ||
            (game.cover && game.cover.image_id
              ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${game.cover.image_id}.jpg`
              : "assets/no-cover.png");

          const hasExe = !!game.executable;
          const exeStatus = hasExe
            ? `<button class="linked-btn" onclick="confirmUnlink('${game.id}')">Vinculado</button>`
            : `<button onclick="setExecutable('${game.id}')">Vincular</button>`;
          const playButton = hasExe
            ? `<button class="primary" onclick="launchGame('${game.id}')">Jugar</button>`
            : "";

          // Dropdown para biblioteca
          const buttonsHtml = `
            ${exeStatus}
            ${playButton}
            <div class="action-menu">
              <button class="more-btn" onclick="toggleDropdown(event, '${game.id}')">⋯</button>
              <div id="dropdown-${game.id}" class="dropdown-content">
                 <div class="dropdown-item" onclick="openInfoModal('${game.id}')">Información</div>
                 <div class="dropdown-item" onclick="markCompleted('${game.id}')">Marcar como pasado</div>
                 <div class="dropdown-item" onclick="openSortKeyEditor('${game.id}')">Cambiar orden</div>
                 <div class="dropdown-item" onclick="removeFromLibrary('${game.id}')" style="color: #ff6b6b;">Quitar de biblioteca</div>
              </div>
            </div>
          `;

          const saga = sagaForGame(game.id);
          const sagaTagHtml = saga ? `<div class="saga-tag">📚 ${escapeHtml(saga.name)}</div>` : "";

          div.innerHTML = `
          <img src="${coverUrl}" alt="${safeAttrName}">
          <h3>${escapeHtml(name)}</h3>
          ${sagaTagHtml}
          <div class="card-actions">${buttonsHtml}</div>
        `;

          container.appendChild(div);
        });

        if (mode === "library") renderLibraryIndexBar(games);
      }

      document.addEventListener("click", (e) => {
        if (e.target.classList.contains("add-btn")) {
          const idx = Number(e.target.dataset.index);
          if (gamesTemp[idx]) addFromJson(gamesTemp[idx]);
        }
      });

      // ===============================
      // Notificaciones
      // ===============================
      function showNotification(message, type = "success") {
        const container = document.getElementById("notification-container");
        const notification = document.createElement("div");
        notification.className = `notification ${type}`;
        notification.innerText = message;
        container.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
      }

      // ===============================
      // Filtro biblioteca
      // ===============================
      function toggleLinkedFilter() {
        showOnlyLinked = !showOnlyLinked;
        localStorage.setItem("libraryLinkedFilter", showOnlyLinked);
        applyLibraryFilter();

      }

      function applyLibraryFilter() {
        const btn = document.getElementById("linkedFilterBtn");

        let gamesToShow = libraryGamesCache;
        if (showOnlyLinked)
          gamesToShow = libraryGamesCache.filter((g) => !!g.executable);

      async function confirmUnlink(id) {
        const { isConfirmed } = await Swal.fire({
          background: "#100e10",
          color: "#f3efe6",
          title: "¿Desvincular ejecutable?",
          icon: "question",
          showCancelButton: true,
          confirmButtonColor: "#bc002d",
          confirmButtonText: "Desvincular",
          cancelButtonText: "Cancelar",
        });
        if (!isConfirmed) return;

        try {
          await window.electronAPI.unlinkExecutable(id);
          await loadLibrary();
          refreshSearchUI();
          showNotification("Ejecutable desvinculado correctamente.");

        }

      async function openSortKeyEditor(id) {
        let game = libraryGamesCache.find((g) => String(g.id) === String(id));
        if (!game) {
          const { games, completedGames } = await window.electronAPI.getGames();
          game =
            games.find((g) => String(g.id) === String(id)) ||
            completedGames.find((g) => String(g.id) === String(id));
        }

        if (!game) {
          showNotification("No se encontró el juego.", "error");
          return;
        }

        const name = game.name || "Sin nombre";
        const currentSortKey = game.sortKey || name;

        const coverUrl =
          game.coverUrl ||
          (game.cover && game.cover.image_id
            ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${game.cover.image_id}.jpg`
            : "assets/no-cover.png");

        const { value: newSortKey } = await Swal.fire({
          background: "#100e10",
          color: "#f3efe6",
          title: "Nombre para ordenar",
          html: `
          <div class="sortkey-modal">
            <img src="${coverUrl}" alt="${escapeHtml(name)}" class="sortkey-cover">
            <p>${escapeHtml(name)}</p>
          </div>
        `,
          input: "text",
          inputLabel: "Texto usado para ordenar en la biblioteca",
          inputValue: currentSortKey,
          showCancelButton: true,
          confirmButtonText: "Guardar",
          cancelButtonText: "Cancelar",
        });

        if (newSortKey === undefined) return;

        try {
          await window.electronAPI.updateSortKey(id, newSortKey);
          await loadLibrary();
          showNotification("Orden actualizado correctamente.");
        } catch (err) {
          console.error(err);
          showNotification("Error al actualizar el orden.", "error");
        }
      }

      // ===============================
      // Sagas (carpetas de juegos, con orden propio)
      // ===============================
      async function openSagasModal() {
        let sagas = (await window.electronAPI.getSagas()) || [];
        const { games: libGames, completedGames: doneGames } =
          await window.electronAPI.getGames();
        const allOwned = [...(libGames || []), ...(doneGames || [])];

        const esc = (s) =>
          s
            ? String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
            : "";

        function gameName(id) {
          const g = allOwned.find((x) => Number(x.id) === Number(id));
          return g ? g.name : `#${id}`;
        }

        function sagaOwnerName(gameId, exceptSagaId) {
          const owner = sagas.find(
            (s) => s.id !== exceptSagaId && s.gameIds.includes(Number(gameId))
          );
          return owner ? owner.name : null;
        }

        function sagaBlock(saga) {
          const rows = saga.gameIds
            .map((gid, idx) => {
              return `
              <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.06);">
                <span style="opacity:.5; font-size:12px; width:18px;">${idx + 1}</span>
                <span style="flex:1; font-size:13px;">${esc(gameName(gid))}</span>
                <button type="button" data-saga-up="${saga.id}" data-game="${gid}" style="padding:4px 8px;" ${idx === 0 ? "disabled" : ""}>↑</button>
                <button type="button" data-saga-down="${saga.id}" data-game="${gid}" style="padding:4px 8px;" ${idx === saga.gameIds.length - 1 ? "disabled" : ""}>↓</button>
                <button type="button" data-saga-remove="${saga.id}" data-game="${gid}" style="padding:4px 8px; color:#ff6b6b;">✕</button>
              </div>
            `;
            })
            .join("");

          const addableOptions = allOwned
            .filter((g) => !saga.gameIds.includes(Number(g.id)))
            .map((g) => {
              const otherSaga = sagaOwnerName(g.id, saga.id);
              const label = otherSaga ? `${g.name} (en: ${otherSaga})` : g.name;
              return `<option value="${g.id}">${esc(label)}</option>`;
            })
            .join("");

          return `
          <div style="border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px; margin-bottom:14px; text-align:left;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <b>📚 ${esc(saga.name)}</b>
              <button type="button" data-saga-delete="${saga.id}" style="color:#ff6b6b;">Eliminar saga</button>
            </div>
            <div style="margin-top:8px;">
              ${rows || '<p style="font-size:12px; opacity:.6;">Sin juegos todavía.</p>'}
            </div>
            <div style="display:flex; gap:6px; margin-top:10px;">
              <select data-saga-addselect="${saga.id}" style="flex:1; background:#171516; color:#f3efe6; border:1px solid #302c2e; border-radius:8px; padding:6px;">
                <option value="">${addableOptions ? "Añadir juego..." : "No hay más juegos disponibles"}</option>
                ${addableOptions}
              </select>
              <button type="button" data-saga-addbtn="${saga.id}">Añadir</button>
            </div>
          </div>
        `;
        }

        function render() {
          const sagasHtml = sagas.length
            ? sagas.map(sagaBlock).join("")
            : '<p style="font-size:13px; opacity:.7; margin-bottom:14px;">Todavía no tienes ninguna saga creada.</p>';

          return `
          <div style="text-align:left;">
            ${sagasHtml}
            <div style="display:flex; gap:6px; border-top:1px solid rgba(255,255,255,.1); padding-top:12px;">
              <input type="text" id="newSagaName" placeholder="Nombre de la nueva saga (ej. The Legend of Zelda)"
                     style="flex:1; background:#171516; color:#f3efe6; border:1px solid #302c2e; border-radius:8px; padding:8px;">
              <button type="button" id="newSagaBtn" class="primary">+ Nueva saga</button>
            </div>
          </div>
        `;
        }

        function bind() {
          const popup = Swal.getPopup();
          if (!popup) return;

          const refresh = async () => {
            sagas = (await window.electronAPI.getSagas()) || [];
            Swal.update({ html: render() });
          };

          popup.querySelectorAll("[data-saga-up]").forEach((btn) => {
            btn.onclick = async () => {
              await window.electronAPI.moveGameInSaga(
                btn.dataset.sagaUp,
                btn.dataset.game,
                "up"
              );
              refresh();
            };
          });
          popup.querySelectorAll("[data-saga-down]").forEach((btn) => {
            btn.onclick = async () => {
              await window.electronAPI.moveGameInSaga(
                btn.dataset.sagaDown,
                btn.dataset.game,
                "down"
              );
              refresh();
            };
          });
          popup.querySelectorAll("[data-saga-remove]").forEach((btn) => {
            btn.onclick = async () => {
              await window.electronAPI.removeGameFromSaga(
                btn.dataset.sagaRemove,
                btn.dataset.game
              );
              refresh();
            };
          });
          popup.querySelectorAll("[data-saga-delete]").forEach((btn) => {
            btn.onclick = async () => {
              const { isConfirmed } = await Swal.fire({
                background: "#100e10",
                color: "#f3efe6",
                title: "¿Eliminar esta saga?",
                text: "Los juegos no se borran, solo dejan de estar agrupados.",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#bc002d",
                confirmButtonText: "Eliminar",
                cancelButtonText: "Cancelar",
              });
              if (!isConfirmed) return;
              await window.electronAPI.deleteSaga(btn.dataset.sagaDelete);
              refresh();
            };
          });
          popup.querySelectorAll("[data-saga-addbtn]").forEach((btn) => {
            btn.onclick = async () => {
              const sagaId = btn.dataset.sagaAddbtn;
              const select = popup.querySelector(`[data-saga-addselect="${sagaId}"]`);
              if (!select || !select.value) return;
              await window.electronAPI.addGameToSaga(sagaId, select.value);
              refresh();
            };
          });

          const newBtn = popup.querySelector("#newSagaBtn");
          if (newBtn) {
            newBtn.onclick = async () => {
              const input = popup.querySelector("#newSagaName");
              const name = (input?.value || "").trim();
              if (!name) return;
              await window.electronAPI.createSaga(name);
              refresh();
            };
          }
        }

        await Swal.fire({
          background: "#100e10",
          color: "#f3efe6",
          title: "Sagas",
          width: 760,
          html: render(),
          showConfirmButton: false,
          showCloseButton: true,
          didRender: () => bind(),
        });

        await loadLibrary();
      }

              "pickGog",
              "Vale tanto una carpeta con varios juegos (una subcarpeta por juego) como la carpeta de un único juego"
            )}
            ${row(
              "Sin plataforma (pirata)",
              state.noneRoot,
              "pickNone",
              "Vale tanto una carpeta con varios juegos (una subcarpeta por juego) como la carpeta de un único juego"
            )}
            ${row(
              "Epic LauncherInstalled.dat (opcional)",
              state.epicDatDir,
              "pickEpicDat",
              "Normalmente: C:\\ProgramData\\Epic\\UnrealEngineLauncher"
            )}
            <div style="font-size:12px; opacity:.75">
              Nota: Steam/Epic intentan detectar instalados por manifests. GOG/Sin plataforma importan cada subcarpeta como juego y buscan el .exe.
            </div>
          </div>
        `;
        }

        function bindButtons() {
          const popup = Swal.getPopup();
          if (!popup) return;

          const bind = (id, handler) => {
            const el = popup.querySelector("#" + id);
            if (!el) return;
            el.onclick = handler;
          };

          bind("pickSteam", async () => {
            const res = await window.electronAPI.openDirectoryDialog({
              title: "Selecciona la carpeta raíz de Steam",
            });
            if (!res.canceled) state.steamRoot = res.dirPath;
            Swal.update({ html: render() });
          });

          bind("pickEpic", async () => {
            const res = await window.electronAPI.openDirectoryDialog({
              title: "Selecciona la carpeta Manifests de Epic",
            });
            if (!res.canceled) state.epicManifestsDir = res.dirPath;
            Swal.update({ html: render() });
          });

          bind("pickEpicDat", async () => {
            const res = await window.electronAPI.openDirectoryDialog({
              title: "Selecciona la carpeta donde está LauncherInstalled.dat",
            });
            if (!res.canceled) state.epicDatDir = res.dirPath;
            Swal.update({ html: render() });
          });

          bind("pickGog", async () => {
            const res = await window.electronAPI.openDirectoryDialog({
              title: "Selecciona la carpeta donde están los juegos de GOG",
            });
            if (!res.canceled) state.gogRoot = res.dirPath;
            Swal.update({ html: render() });
          });

          bind("pickNone", async () => {
            const res = await window.electronAPI.openDirectoryDialog({
              title: "Selecciona la carpeta de juegos sin plataforma (pirata)",
            });
            if (!res.canceled) state.noneRoot = res.dirPath;
            Swal.update({ html: render() });
          });
        }

        const result = await Swal.fire({
          background: "#100e10",
          color: "#f3efe6",
          title: "Importar juegos instalados",
          width: 760,
          html: render(),
          showCancelButton: true,
          confirmButtonText: "Importar",
          cancelButtonText: "Cancelar",
          focusConfirm: false,
          customClass: { popup: "import-popup" },
          didRender: () => bindButtons(),
        });

        if (!result.isConfirmed) return;

        const epicLauncherInstalledDat = state.epicDatDir
          ? state.epicDatDir.replace(/\\+$/, "") + "\\LauncherInstalled.dat"
          : null;

        const payload = {
          steamRoot: state.steamRoot,
          epicManifestsDir: state.epicManifestsDir,
          epicLauncherInstalledDat,
          gogRoot: state.gogRoot,
          noneRoot: state.noneRoot,
        };

        try {
          Swal.fire({
            background: "#100e10",
            color: "#f3efe6",
            title: "Importando...",
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading(),
          });

          // El resumen final se construye con el reporte real de la
          // importación (antes se descartaba y se mostraban los numeros del
          // enriquecido de caratulas, que no tienen nada que ver - por eso
          // parecia que "no pasaba nada" aunque sí se hubiera importado, o
          // al revés).
          const importResult = await window.electronAPI.importInstalledGames(payload);
          const report = importResult?.report || {};
          const labels = { steam: "Steam", epic: "Epic", gog: "GOG", none: "Sin plataforma" };

          const lines = [];
          let totalImported = 0;
          for (const key of ["steam", "epic", "gog", "none"]) {
            const r = report[key];
            if (!r) continue;
            totalImported += r.imported || 0;
            if (r.imported > 0) lines.push(`${labels[key]}: ${r.imported} juego(s) importados`);
            (r.errors || []).forEach((e) => lines.push(`${labels[key]}: ${e}`));
          }

          await window.electronAPI.enrichCovers({ limit: 80 });
          await loadLibrary();
          refreshSearchUI();

          if (totalImported === 0) {
            showNotification(
              "No se encontró ningún juego nuevo en las carpetas seleccionadas.",
              "error"
            );
            Swal.fire({
              background: "#100e10",
              color: "#f3efe6",
              icon: "info",
              title: "No se importó nada",
              html: lines.length
                ? lines.map((l) => `<div>${escapeHtml(l)}</div>`).join("")
                : "Revisa que hayas seleccionado la carpeta correcta (la que contiene el juego o sus subcarpetas).",
            });
          } else {
            showNotification(`${totalImported} juego(s) importados correctamente.`);
            Swal.fire({
              background: "#100e10",
              color: "#f3efe6",
              icon: "success",
              title: "Importación completada",
              html: lines.map((l) => `<div>${escapeHtml(l)}</div>`).join(""),
            });
          }
        } catch (err) {
          console.error(err);
          Swal.fire({
            background: "#100e10",
            color: "#f3efe6",
            icon: "error",
            title: "Error importando",
            text: String(err?.message || err),
          });
        }
      }

      // ===============================
      // GAMEPAD: foco + acciones
      // ===============================
      function setupGamepad() {
        window.addEventListener("gamepadconnected", (e) => {
          activePadIndex = e.gamepad.index;
          showNotification(`Mando conectado`, "success");
        });

        window.addEventListener("gamepaddisconnected", (e) => {
          if (activePadIndex === e.gamepad.index) activePadIndex = null;
          showNotification(`Mando desconectado`, "error");
        });

        requestAnimationFrame(tickGamepad);
      }

      function getPad() {
        const pads = navigator.getGamepads?.() || [];
        if (activePadIndex != null && pads[activePadIndex])
          return pads[activePadIndex];
        return pads.find(Boolean) || null;
      }

      function edge(now, key) {
        const fired = now && !gpLast[key];
        gpLast[key] = now;
        return fired;
      }

      function getCardsInActiveGrid() {
        const secId = getActiveSectionId();
        if (secId === "popular")
          return Array.from(document.querySelectorAll("#gamesList .game-card"));
        if (secId === "library")
          return Array.from(
            document.querySelectorAll("#libraryList .game-card")
          );
        if (secId === "completed")
          return Array.from(
            document.querySelectorAll("#completedList .game-card")
          );
        return [];
      }

      function updateGamepadFocus(force = false) {
        const cards = getCardsInActiveGrid();
        cards.forEach((c) => c.classList.remove("gp-focused"));

        if (cards.length === 0) return;

        if (focusedIndex < 0) focusedIndex = 0;
        if (focusedIndex >= cards.length) focusedIndex = cards.length - 1;

        const focused = cards[focusedIndex];
        if (focused) {
          focused.classList.add("gp-focused");
          focused.scrollIntoView({
            block: "nearest",
            inline: "nearest",
            behavior: force ? "auto" : "smooth",
          });
        }
      }

      function getGridColumns() {
        const w = window.innerWidth;
        if (w <= 700) return 2;
        if (w <= 1000) return 3;
        if (w <= 1400) return 4;
        return 6;
      }

      function clickPrimaryActionOnFocused() {
        const cards = getCardsInActiveGrid();
        const card = cards[focusedIndex];
        if (!card) return;

        // Prioridad: botón primary (Jugar/Agregar)
        const primary = card.querySelector("button.primary");
        if (primary) return primary.click();

        // Si no hay primary, click al primer button normal
        const anyBtn = card.querySelector("button");
        if (anyBtn) return anyBtn.click();
      }

      function backAction() {
        const popup = Swal.getPopup?.();
        if (popup) {
          Swal.close();
          return;
        }

        // Volver a biblioteca como acción "atrás" sencilla
        showSection(
          "library",
          document.querySelectorAll(".topnav-item")[1]
        );
      }

      function switchSection(delta) {
        const items = Array.from(document.querySelectorAll(".topnav-item"));
        const activeIdx = items.findIndex((li) =>
          li.classList.contains("active")
        );
        if (activeIdx < 0) return;
        let next = activeIdx + delta;
        if (next < 0) next = items.length - 1;
        if (next >= items.length) next = 0;
        items[next].click();
      }

      function tickGamepad() {
        const gp = getPad();

        if (gp) {
          const up = !!gp.buttons[12]?.pressed || (gp.axes?.[1] ?? 0) < -0.6;
          const down = !!gp.buttons[13]?.pressed || (gp.axes?.[1] ?? 0) > 0.6;
          const left = !!gp.buttons[14]?.pressed || (gp.axes?.[0] ?? 0) < -0.6;
          const right = !!gp.buttons[15]?.pressed || (gp.axes?.[0] ?? 0) > 0.6;

          const a = !!gp.buttons[0]?.pressed; // A / Cross
          const b = !!gp.buttons[1]?.pressed; // B / Circle
          const x = !!gp.buttons[2]?.pressed;
          const y = !!gp.buttons[3]?.pressed;
          const lb = !!gp.buttons[4]?.pressed;
          const rb = !!gp.buttons[5]?.pressed;

          const cols = getGridColumns();

          if (edge(up, "up")) {
            focusedIndex -= cols;
            updateGamepadFocus();
          }
          if (edge(down, "down")) {
            focusedIndex += cols;
            updateGamepadFocus();
          }
          if (edge(left, "left")) {
            focusedIndex -= 1;
            updateGamepadFocus();
          }
          if (edge(right, "right")) {
            focusedIndex += 1;
            updateGamepadFocus();
          }

          if (edge(a, "a")) clickPrimaryActionOnFocused();
          if (edge(b, "b")) backAction();

          if (edge(lb, "lb")) switchSection(-1);
          if (edge(rb, "rb")) switchSection(+1);

          if (edge(x, "x")) {
            if (getActiveSectionId() === "library") toggleLinkedFilter();
          }

          if (edge(y, "y")) {
            if (getActiveSectionId() === "popular") {
              document.getElementById("searchInput")?.focus();
            }
          }
        }

        requestAnimationFrame(tickGamepad);
      }
    </script>
  </body>
</html>
