<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sharingan Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Michroma&family=Exo+2:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Nunito:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/01-base.css" />
    <link rel="stylesheet" href="styles/02-components.css" />
    <link rel="stylesheet" href="styles/03-glass.css" />
    <link rel="stylesheet" href="styles/04-jarvis.css" />
    <link rel="stylesheet" href="styles/05-refresh.css" />
    <link rel="stylesheet" href="styles/06-retro.css" />
    <link rel="stylesheet" href="styles/07-theme-picker.css" />
    <link rel="stylesheet" href="styles/08-y2k.css" />
    <link rel="stylesheet" href="styles/09-effects.css" />
    <link rel="stylesheet" href="styles/10-settings.css" />
    <link rel="stylesheet" href="styles/11-motion.css" />
    <link rel="stylesheet" href="styles/12-play-free-shortcuts.css" />
    <link rel="stylesheet" href="styles/13-glass-extra.css" />
    <link rel="stylesheet" href="styles/pokepark.css" />
    <link rel="stylesheet" href="styles/community.css" />
    <link rel="stylesheet" href="styles/spotify.css" />
    <link rel="stylesheet" href="styles/spotify-setup.css" />
    <link rel="stylesheet" href="styles/launcher.css" />
  </head>
  <body class="is-guest">
    <div class="theme-bg" aria-hidden="true"></div>
    <audio id="easter-audio" src="assets/dartacan.mp3" preload="auto"></audio>

    <!-- Pantalla de Intro -->
    <div id="intro-screen">
      <div class="intro-content">
        <img src="assets/icon.png" alt="Logo" class="intro-logo" />
        <h1 class="intro-title">Sharingan Launcher</h1>
      </div>
      <audio id="intro-audio" src="assets/intro.mp3"></audio>
    </div>

    <div id="notification-container"></div>
    <div id="updateToast" class="update-toast" role="status" aria-live="polite"></div>

    <div class="app">
      <!-- Barra lateral: secciones, jugado recientemente y la cuenta -->
      <nav class="topnav sidebar" aria-label="Secciones">
        <span class="topnav-title"><img class="topnav-logo" src="assets/icon.png" alt="" /><span>Sharingan<small>Launcher</small></span></span>
        <div class="topnav-item active" role="button" tabindex="0" aria-label="Descubrir" onclick="showSection('popular', this)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg>
          <span class="topnav-label">Descubrir</span>
        </div>
        <div class="topnav-item" role="button" tabindex="0" aria-label="Mi biblioteca" onclick="showSection('library', this)">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span class="topnav-label">Biblioteca</span>
          <span class="nav-count" id="navLibraryCount"></span>
        </div>
        <div class="topnav-item" role="button" tabindex="0" aria-label="Juegos pasados" onclick="showSection('completed', this)">
          <svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a2 2 0 0 0 0 4h1"/><path d="M17 6h3a2 2 0 0 1 0 4h-1"/></svg>
          <span class="topnav-label">Pasados</span>
          <span class="nav-count" id="navCompletedCount"></span>
        </div>
        <div class="topnav-item needs-account" role="button" tabindex="0" aria-label="PokéPark" onclick="showSection('pokepark', this)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h6"/><path d="M15 12h6"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="topnav-label">PokéPark</span>
        </div>
        <div class="topnav-item needs-account" data-section="community" role="button" tabindex="0" aria-label="Comunidad" onclick="showSection('community', this)">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="topnav-label">Comunidad</span>
        </div>

        <!-- Lo último que has jugado (renderRecent) -->
        <div class="side-recent" id="sideRecent" hidden>
          <p class="side-label">Jugado recientemente</p>
          <div class="side-recent-list" id="sideRecentList"></div>
        </div>

        <span class="topnav-spacer"></span>
        <!-- Spotify (spotify-ui.js); se puede ocultar en Ajustes › Spotify -->
        <button type="button" id="spotifyBtn" class="sp-btn needs-account" hidden aria-haspopup="dialog" aria-expanded="false"></button>
        <!-- Cuenta (community.js pinta la foto y el nombre) y ajustes -->
        <div class="side-user">
          <button type="button" id="accountBtn" class="side-account" title="Tu cuenta"></button>
          <button class="icon-btn settings-btn" onclick="openSettingsModal()" title="Ajustes" aria-label="Ajustes">
            <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          </button>
        </div>
      </nav>

      <!-- Contenido principal -->
      <main class="main-content">
        <!-- Populares / búsqueda -->
        <section id="popular" class="section active">
          <header class="page-head">
            <div class="page-head-title">
              <span class="section-eyebrow">Catálogo</span>
              <h2 class="section-title">Descubrir</h2>
            </div>
            <div class="page-head-actions">
              <button type="button" id="freeBtn" class="free-btn" onclick="FreeGames.open()" title="Juegos de pago que están gratis para quedártelos">
                <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
                <span>Gratis</span><em class="free-count is-empty">0</em>
              </button>
              <button type="button" id="jarvisBtn" class="jarvis-btn needs-account" onclick="openJarvis()" title="Recomendaciones según tu biblioteca">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/></svg>
                <span>Recomendación por Jarvis</span>
              </button>
            </div>
          </header>
          <div class="discover-bar">
            <div class="discover-search-row">
              <label class="search-field">
                <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input
                  type="text"
                  id="searchInput"
                  placeholder="Buscar juegos..."
                  aria-label="Buscar juegos"
                  oninput="onSearchInput()"
                />
              </label>
            </div>
            <div class="discover-toolbar">
              <select id="genreFilter" onchange="loadDiscoverGames()" aria-label="Género">
                <option value="">Todos los géneros</option>
              </select>
              <select id="sortFilter" onchange="loadDiscoverGames()" aria-label="Orden">
                <option value="popular">Más popular</option>
                <option value="az">Nombre A-Z</option>
                <option value="za">Nombre Z-A</option>
                <option value="year_desc">Año: más reciente</option>
                <option value="year_asc">Año: más antiguo</option>
                <option value="upcoming">Próximamente</option>
              </select>
            </div>
          </div>
          <div id="discoverIndexBar" class="index-bar"></div>
          <div id="ownedMatches" class="own-matches" hidden></div>
          <div id="jarvisBar" class="jarvis-bar" hidden>
            <div class="jarvis-bar-text">
              <b>Recomendado por Jarvis</b>
              <span id="jarvisBarText"></span>
            </div>
            <button type="button" class="sl-btn sl-btn-ghost sl-btn-sm" id="jarvisMoreBtn" onclick="openJarvis(true)">Otra tanda</button>
            <button type="button" class="sl-btn sl-btn-ghost sl-btn-sm" onclick="exitJarvis()">Volver al catálogo</button>
          </div>
          <div id="gamesList" class="cards-grid"></div>
          <div class="load-more-wrap">
            <button id="loadMoreBtn" class="filter-btn" onclick="loadMoreDiscoverGames()" style="display:none;">
              Cargar más
            </button>
          </div>
        </section>

        <!-- Juegos gratis (lógica en free-ui.js; los datos, freegames.js en main) -->
        <section id="free" class="section">
          <div class="free-root" id="freeRoot"></div>
        </section>

        <!-- Biblioteca -->
        <section id="library" class="section">
          <div class="library-header page-head">
            <div class="library-header-title page-head-title">
              <span class="section-eyebrow">Mi biblioteca</span>
              <h2 class="section-title"><span>Biblioteca</span><em class="title-count" id="libraryTitle">0</em></h2>
            </div>

            <button class="filter-btn" onclick="openImportModal()">
              <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Importar instalados
            </button>

            <button class="filter-btn needs-account" onclick="openSagasModal()">
              <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
              Sagas
            </button>
          </div>

          <!-- Buscar, filtrar y ordenar (library-tools.js) -->
          <div class="lib-toolbar">
            <label class="search-field lib-search">
              <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="libSearch" placeholder="Buscar en tu biblioteca..." aria-label="Buscar en tu biblioteca" spellcheck="false" />
            </label>
            <select id="libStore" class="lib-select" aria-label="Tienda">
              <option value="">Todas las tiendas</option>
              <option value="steam">Steam</option>
              <option value="epic">Epic Games</option>
              <option value="gog">GOG</option>
              <option value="none">Sin tienda</option>
            </select>
            <select id="libState" class="lib-select" aria-label="Estado">
              <option value="">Todos</option>
              <option value="playable">Jugables</option>
              <option value="installed">Instalados</option>
              <option value="notInstalled">Sin instalar</option>
              <option value="unplayed">Sin jugar</option>
              <option value="played">Jugados</option>
            </select>
            <select id="libSort" class="lib-select" aria-label="Ordenar">
              <option value="az">A-Z (con sagas)</option>
              <option value="recent">Jugado recientemente</option>
              <option value="most">Más jugado</option>
              <option value="added">Añadido recientemente</option>
              <option value="release">Lanzamiento</option>
            </select>
            <button type="button" class="filter-btn lib-clear" id="libClear" hidden>Quitar filtros</button>
          </div>

          <div id="libraryIndexBar" class="index-bar"></div>

          <div id="libraryList" class="cards-grid"></div>
        </section>

        <!-- Pasados -->
        <section id="completed" class="section">
          <header class="page-head">
            <div class="page-head-title">
              <span class="section-eyebrow">Historial</span>
              <h2 class="section-title" id="completedTitle">Juegos pasados</h2>
            </div>
          </header>
          <div id="completedList" class="cards-grid"></div>
        </section>

        <!-- PokéPark (lógica en pokepark.js) -->
        <section id="pokepark" class="section">
          <div class="pp-root" id="ppRoot"></div>
        </section>

        <!-- Comunidad: chat, reportes y logros (lógica en community.js) -->
        <section id="community" class="section">
          <div class="cm-root" id="cmRoot"></div>
        </section>

        <!-- Página de un juego (gamepage.js): la misma para todos, cambian los datos -->
        <section id="game" class="section">
          <div class="gp-root" id="gpRoot"></div>
        </section>

      </main>

      <button
        id="scrollTopBtn"
        class="scroll-top-btn"
        onclick="scrollActiveSectionToTop()"
        title="Volver arriba"
        aria-label="Volver arriba"
      >
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
      </button>
    </div>

    <script src="node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="themes.js"></script>
    <script src="renderer/pokepark.js" defer></script>
    <script src="renderer/free-ui.js" defer></script>
    <script src="renderer/shortcuts.js" defer></script>
    <script src="renderer/liquid-glass.js" defer></script>
    <script src="renderer/achievements.js" defer></script>
    <script src="renderer/community.js" defer></script>
    <script src="renderer/spotify-setup.js" defer></script>
    <script src="renderer/cd3d.js" defer></script>
    <script src="renderer/spotify-ui.js" defer></script>
    <script src="renderer/gamepage.js" defer></script>

    <script src="renderer/core.js"></script>
    <script src="renderer/discover.js"></script>
    <script src="renderer/library.js"></script>
    <script src="renderer/actions.js"></script>
    <script src="renderer/cards.js"></script>
    <script src="renderer/library-tools.js"></script>
    <script src="renderer/settings.js"></script>
    <script src="renderer/data.js"></script>
    <script src="renderer/import.js"></script>
    <script src="renderer/gamepad.js"></script>
  </body>
</html>
