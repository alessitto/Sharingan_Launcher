<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sharingan Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pokepark.css" />
  </head>
  <body>
    <div class="theme-bg" aria-hidden="true"></div>
    <audio id="easter-audio" src="assets/dartacan.mp3" preload="auto"></audio>

    <!-- Pantalla de Intro -->
    <div id="intro-screen">
      <div class="intro-content">
        <img src="assets/icon.png" alt="Logo" class="intro-logo" />
        <h1 class="intro-title">Sharingan Launcher</h1>
      </div>
      <audio id="intro-audio" src="assets/intro.mp3"></audio>
    </div>

    <div id="notification-container"></div>
    <div id="updateToast" class="update-toast" role="status" aria-live="polite"></div>

    <div class="app">
      <!-- Navegación superior -->
      <nav class="topnav">
        <span class="topnav-title">Sharingan Launcher</span>
        <div class="topnav-item active" onclick="showSection('popular', this)">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          Descubrir
        </div>
        <div class="topnav-item" onclick="showSection('library', this)">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Mi biblioteca
        </div>
        <div class="topnav-item" onclick="showSection('completed', this)">
          <svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a2 2 0 0 0 0 4h1"/><path d="M17 6h3a2 2 0 0 1 0 4h-1"/></svg>
          Juegos pasados
        </div>
        <div class="topnav-item" onclick="showSection('pokepark', this)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h6"/><path d="M15 12h6"/><circle cx="12" cy="12" r="3"/></svg>
          PokéPark
        </div>

        <span id="versionLink" class="version-link" onclick="openChangelogModal()" title="Historial de versiones"></span>
        <button class="icon-btn settings-btn" onclick="openSettingsModal()" title="Ajustes" aria-label="Ajustes">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </nav>

      <!-- Contenido principal -->
      <main class="main-content">
        <!-- Populares / búsqueda -->
        <section id="popular" class="section active">
          <span class="section-eyebrow">Catálogo</span>
          <h2 class="section-title">Descubrir</h2>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar juegos..."
            oninput="onSearchInput()"
          />
          <div class="discover-toolbar">
            <select id="genreFilter" onchange="loadDiscoverGames()">
              <option value="">Todos los géneros</option>
            </select>
            <select id="sortFilter" onchange="loadDiscoverGames()">
              <option value="popular">Más popular</option>
              <option value="az">Nombre A-Z</option>
              <option value="za">Nombre Z-A</option>
              <option value="year_desc">Año: más reciente</option>
              <option value="year_asc">Año: más antiguo</option>
              <option value="upcoming">Próximamente</option>
            </select>
          </div>
          <div id="discoverIndexBar" class="index-bar"></div>
          <div id="gamesList" class="cards-grid"></div>
          <div class="load-more-wrap">
            <button id="loadMoreBtn" class="filter-btn" onclick="loadMoreDiscoverGames()" style="display:none;">
              Cargar más
            </button>
          </div>
        </section>

        <!-- Biblioteca -->
        <section id="library" class="section">
          <div class="library-header">
            <div class="library-header-title">
              <span class="section-eyebrow">Mi biblioteca</span>
              <h2 class="section-title" id="libraryTitle" style="margin-bottom: 0;">Juegos (0)</h2>
            </div>

            <button
              id="linkedFilterBtn"
              class="filter-btn"
              onclick="toggleLinkedFilter()"
              title="Mostrar solo los juegos que se pueden lanzar"
            >
              <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              Jugables
            </button>

            <button class="filter-btn" onclick="openImportModal()">
              <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
              Importar instalados
            </button>

            <button class="filter-btn" onclick="openSagasModal()">
              <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
              Sagas
            </button>
          </div>

          <div id="libraryIndexBar" class="index-bar"></div>

          <div id="libraryList" class="cards-grid"></div>
        </section>

        <!-- Pasados -->
        <section id="completed" class="section">
          <span class="section-eyebrow">Historial</span>
          <h2 class="section-title">Juegos pasados</h2>
          <div id="completedList" class="cards-grid"></div>
        </section>

        <!-- PokéPark (lógica en pokepark.js) -->
        <section id="pokepark" class="section">
          <div class="pp-root" id="ppRoot"></div>
        </section>
      </main>

      <button
        id="scrollTopBtn"
        class="scroll-top-btn"
        onclick="scrollActiveSectionToTop()"
        title="Volver arriba"
        aria-label="Volver arriba"
      >
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
      </button>
    </div>

    <script src="node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="pokepark.js" defer></script>

    <script>
      // ===============================
      // Variables globales
      // ===============================
      let gamesTemp = [];
      let libraryIds = new Set();
      // Descubrir espera a la biblioteca para poder quitar lo que ya tienes.
      let libraryReady = Promise.resolve();
      let currentSearchGames = [];
      let showOnlyLinked = false;
      let libraryGamesCache = [];
      let completedGamesCache = [];
      let sagasCache = [];
      let dartacanPlayed = false;

      // Gamepad state
      let activePadIndex = null;
      let gpLast = {
        up: false,
        down: false,
        left: false,
        right: false,
        a: false,
        b: false,
        x: false,
        y: false,
        lb: false,
        rb: false,
      };
      let focusedIndex = 0;
      let focusedContainerId = "gamesList"; // cambia según sección

      // Nombres de juegos "sin plataforma" vienen literalmente del nombre de
      // carpeta que elige el usuario — nunca se insertan en innerHTML sin
      // pasar por aquí antes.
      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // ===============================
      // Iconos (trazos estilo Lucide, heredan color con currentColor)
      // ===============================
      const ICON_PATHS = {
        more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
        arrowUp: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
        crown: '<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/>',
        layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
        grip: '<circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
        pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
        searchX: '<path d="m13.5 8.5-5 5"/><path d="m8.5 8.5 5 5"/><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        checkCircle: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
        alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
        xCircle: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
        folderOpen: '<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
        folderPlus: '<path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
        calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
        sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
        info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
        gamepad: '<line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>',
        play: '<polygon points="6 3 20 12 6 21 6 3"/>',
        save: '<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>',
      };

      function icon(name, cls = "") {
        return `<svg class="i ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ""}</svg>`;
      }

      function coverOf(game) {
        return (
          game?.coverUrl ||
          (game?.cover?.image_id
            ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${game.cover.image_id}.jpg`
            : "assets/no-cover.png")
        );
      }

      function releaseYear(game) {
        return game?.first_release_date ? new Date(game.first_release_date * 1000).getFullYear() : null;
      }

      // Se puede jugar si tiene .exe o si su launcher sabe abrirlo (Steam,
      // Epic o GOG Galaxy con su id) - mismo criterio que main.js.
      function canPlay(g) {
        return !!(
          g.executable ||
          (g.platform === "steam" && g.steamAppId) ||
          (g.platform === "epic" && g.epicAppName) ||
          (g.platform === "gog" && g.gogGameId)
        );
      }

      // ===============================
      // Modales (SweetAlert2 con el aspecto de la app)
      // ===============================
      // Todo sale de las variables del tema activo, así los modales cambian
      // de color con el tema igual que el resto (antes llevaban el negro y
      // rojo de Uchiha fijos).
      function openModal(opts = {}) {
        const { eyebrow, title, customClass = {}, ...rest } = opts;
        return Swal.fire({
          background: "var(--ink-900)",
          color: "var(--washi-100)",
          buttonsStyling: false,
          reverseButtons: true,
          closeButtonHtml: icon("x"),
          showClass: { popup: "sl-modal-in" },
          hideClass: { popup: "sl-modal-out" },
          title: title
            ? `${eyebrow ? `<span class="sl-modal-eyebrow">${escapeHtml(eyebrow)}</span>` : ""}${escapeHtml(title)}`
            : undefined,
          ...rest,
          customClass: {
            popup: `sl-modal ${customClass.popup || ""}`,
            title: "sl-modal-title",
            htmlContainer: "sl-modal-body",
            actions: "sl-modal-actions",
            confirmButton: `sl-btn sl-btn-primary ${customClass.confirmButton || ""}`,
            cancelButton: "sl-btn sl-btn-ghost",
            denyButton: "sl-btn sl-btn-ghost",
            closeButton: "sl-modal-close",
            input: "sl-input",
            inputLabel: "sl-input-label",
            validationMessage: "sl-validation",
          },
        });
      }

      // Confirmación corta con icono propio (sin los iconos animados de
      // SweetAlert, que no pegan con el resto de la app).
      async function confirmDialog({ title, text, confirmText = "Aceptar", danger = false, iconName }) {
        const { isConfirmed } = await openModal({
          width: 420,
          html: `
            <div class="sl-confirm">
              <span class="sl-confirm-icon ${danger ? "is-danger" : ""}">${icon(iconName || (danger ? "trash" : "info"))}</span>
              <h3 class="sl-confirm-title">${escapeHtml(title)}</h3>
              ${text ? `<p class="sl-confirm-text">${escapeHtml(text)}</p>` : ""}
            </div>`,
          showCancelButton: true,
          confirmButtonText: confirmText,
          cancelButtonText: "Cancelar",
          focusCancel: danger,
          customClass: { popup: "sl-modal-sm", confirmButton: danger ? "sl-btn-danger" : "" },
        });
        return isConfirmed;
      }

      function loadingModal(title, text = "") {
        return openModal({
          width: 400,
          html: `
            <div class="sl-loading">
              <span class="sl-spinner"></span>
              <h3 class="sl-confirm-title">${escapeHtml(title)}</h3>
              <p class="sl-confirm-text" id="slLoadingText">${escapeHtml(text)}</p>
            </div>`,
          showConfirmButton: false,
          allowOutsideClick: false,
          allowEscapeKey: false,
          customClass: { popup: "sl-modal-sm" },
        });
      }

      // Botón "Información" reutilizable — en Juegos populares deja ver los
      // requisitos antes de decidir si merece la pena añadirlo.
      function infoButtonHtml(gameId) {
        return `<button class="icon-btn" onclick="openInfoModal('${gameId}')" title="Información" aria-label="Información">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.5" fill="currentColor" stroke-width="1.5"/></svg>
        </button>`;
      }

      // ===============================
      // Navegación lateral
      // ===============================
      function showSection(id, el) {
        document
          .querySelectorAll(".section")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");

        document
          .querySelectorAll(".topnav-item")
          .forEach((li) => li.classList.remove("active"));
        if (el) el.classList.add("active");

        // al cambiar sección, vuelve arriba del todo (si no, se arrastra el
        // scroll de la sección anterior) y reinicia foco al primer elemento
        document.querySelector(".main-content")?.scrollTo(0, 0);
        document.getElementById("scrollTopBtn")?.classList.remove("show");

        if (id === "popular") focusedContainerId = "gamesList";
        if (id === "library") focusedContainerId = "libraryList";
        if (id === "completed") focusedContainerId = "completedList";
        document.body.classList.toggle("in-pokepark", id === "pokepark");
        if (id === "pokepark") window.PokePark?.onShow();
        focusedIndex = 0;
        updateGamepadFocus(true);
      }

      function getActiveSectionId() {
        const el = document.querySelector(".section.active");
        return el?.id || "popular";
      }

      // ===============================
      // Carga inicial (UNIFICADA)
      // ===============================
      window.addEventListener("DOMContentLoaded", async () => {
        // filtro biblioteca
        const savedFilter = localStorage.getItem("libraryLinkedFilter");
        showOnlyLinked = savedFilter === "true";

        // intro
        const introScreen = document.getElementById("intro-screen");
        const introAudio = document.getElementById("intro-audio");

        try {
          introAudio.volume = 0.5;
          await introAudio.play();
        } catch (err) {
          console.warn("Audio bloqueado o no encontrado:", err);
        }

        // carga datos
        await loadAppSettings();
        loadGenreOptions();
        loadAppVersion();
        setupUpdateToast();
        libraryReady = loadLibrary();
        const loadPromises = Promise.all([libraryReady, loadDiscoverGames()]);

        setTimeout(async () => {
          await loadPromises;
          introScreen.classList.add("hidden");
          setTimeout(() => introScreen.remove(), 500);

          // foco inicial mando
          focusedContainerId = "gamesList";
          focusedIndex = 0;
          updateGamepadFocus(true);
        }, 2000);

        // gamepad loop
        setupGamepad();
      });

      // Cerrar dropdowns al hacer click fuera
      window.addEventListener("click", (e) => {
        if (!e.target.closest(".more-btn")) {
          document
            .querySelectorAll(".dropdown-content")
            .forEach((d) => d.classList.remove("show"));
        }
      });

      // Botón flotante "volver arriba" - .main-content es el contenedor que
      // de verdad scrollea (overflow:auto), no la ventana.
      const mainContentEl = document.querySelector(".main-content");
      if (mainContentEl) {
        mainContentEl.addEventListener("scroll", () => {
          const btn = document.getElementById("scrollTopBtn");
          if (btn) btn.classList.toggle("show", mainContentEl.scrollTop > 400);
        });
      }

      function scrollActiveSectionToTop() {
        mainContentEl?.scrollTo({ top: 0, behavior: "smooth" });
      }

      // ===============================
      // Descubrir (populares / búsqueda / filtros) — IGDB
      // ===============================
      let lastSearchTimeout = null;

      function onSearchInput() {
        const q = document.getElementById("searchInput").value.trim();
        // Easter egg: "Dartacan"
        const normalized = q.toLowerCase();
        if (normalized === "dartacan") {
          if (!dartacanPlayed) {
            dartacanPlayed = true;

            const audio = document.getElementById("easter-audio");
            if (audio) {
              audio.currentTime = 0;
              audio.play().catch((err) => {
                console.warn(
                  "No se pudo reproducir el easter egg (autoplay/política):",
                  err
                );
              });
            }
          }
        } else {
          dartacanPlayed = false;
        }
        clearTimeout(lastSearchTimeout);
        lastSearchTimeout = setTimeout(loadDiscoverGames, 350);
      }

      // Carga la lista de géneros de IGDB una vez, para el desplegable.
      async function loadGenreOptions() {
        try {
          const genres = await window.electronAPI.getGenres();
          const select = document.getElementById("genreFilter");
          if (!select || !Array.isArray(genres)) return;
          for (const g of genres) {
            if (!g.name) continue;
            const opt = document.createElement("option");
            opt.value = g.id;
            opt.textContent = g.name;
            select.appendChild(opt);
          }
        } catch (err) {
          console.error("No se pudieron cargar los géneros", err);
        }
      }

      // Punto único: con texto de búsqueda o sin él, con o sin filtros — todo
      // pasa por aquí. Antes había dos funciones casi iguales (populares y
      // búsqueda) que no compartían ni el filtro de género ni el de orden.
      //
      // Paginación: sin búsqueda de texto, main.js pagina de verdad contra
      // IGDB (offset), así que aquí solo se pide la siguiente página. Con
      // búsqueda, main.js trae de una vez el pool completo (hasta 500, el
      // máximo de IGDB) ya ordenado, y aquí se pagina en local sobre ese
      // array sin volver a llamar a la API - así ya no hay tope de 60.
      let DISCOVER_PAGE_SIZE = 60;
      let discoverOffset = 0;
      let discoverHasMore = false;
      let discoverSearchPool = null;
      let discoverSearchShown = 0;
      // Letra activa del índice (solo aplica navegando, sin texto de
      // búsqueda) - "Cargar más" la mantiene para seguir paginando DENTRO
      // de esa letra en vez de volver al listado general.
      let discoverActiveLetter = null;

      async function loadDiscoverGames() {
        renderDiscoverIndexBar();
        discoverOffset = 0;
        discoverSearchPool = null;
        discoverSearchShown = 0;
        discoverActiveLetter = null;
        gamesTemp = [];
        currentSearchGames = [];

        const query = document.getElementById("searchInput")?.value.trim() || "";
        const genreId = document.getElementById("genreFilter")?.value || null;
        const sort = document.getElementById("sortFilter")?.value || "popular";

        // El índice de letras solo tiene sentido navegando en alfabético sin
        // texto de búsqueda (con "más popular"/año/próximamente o buscando
        // por nombre, saltar a una letra no corresponde a nada coherente).
        const bar = document.getElementById("discoverIndexBar");
        if (bar) bar.style.display = (sort === "az" || sort === "za") && !query ? "" : "none";

        const res = await window.electronAPI.discoverGames({ query, genreId, sort, offset: 0, pageSize: DISCOVER_PAGE_SIZE });
        await applyDiscoverPage(res, true);
        updateGamepadFocus(true);
      }

      async function loadMoreDiscoverGames() {
        if (discoverSearchPool) {
          const next = discoverSearchPool.slice(
            discoverSearchShown,
            discoverSearchShown + DISCOVER_PAGE_SIZE
          );
          discoverSearchShown += next.length;
          appendDiscoverGames(next);
          updateLoadMoreButton(discoverSearchShown < discoverSearchPool.length);
          return;
        }

        const genreId = document.getElementById("genreFilter")?.value || null;
        const sort = document.getElementById("sortFilter")?.value || "popular";
        discoverOffset += DISCOVER_PAGE_SIZE;

        const res = await window.electronAPI.discoverGames({
          query: "",
          genreId,
          sort,
          offset: discoverOffset,
          letterPrefix: discoverActiveLetter,
          pageSize: DISCOVER_PAGE_SIZE,
        });
        await applyDiscoverPage(res, false);
      }

      // Lo que ya tienes (biblioteca o pasados) no sale en Descubrir.
      const notOwned = (items) => items.filter((g) => !libraryIds.has(g.id));

      async function applyDiscoverPage(res, replace) {
        await libraryReady;
        const items = notOwned((res && res.items) || []);

        if (res && res.fullPool) {
          discoverSearchPool = items;
          discoverSearchShown = Math.min(DISCOVER_PAGE_SIZE, items.length);
          const firstPage = items.slice(0, discoverSearchShown);
          gamesTemp = [];
          currentSearchGames = firstPage.slice();
          displayGames("gamesList", firstPage, "add");
          updateLoadMoreButton(discoverSearchShown < items.length);
          return;
        }

        discoverHasMore = !!(res && res.hasMore);
        if (replace) {
          gamesTemp = [];
          currentSearchGames = items.slice();
          displayGames("gamesList", items, "add");
        } else {
          appendDiscoverGames(items);
        }
        updateLoadMoreButton(discoverHasMore);
      }

      function appendDiscoverGames(items) {
        const container = document.getElementById("gamesList");
        if (!container) return;
        items = notOwned(items);
        currentSearchGames.push(...items);
        items.forEach((game) => container.appendChild(buildDiscoverCard(game)));
      }

      function updateLoadMoreButton(show) {
        const btn = document.getElementById("loadMoreBtn");
        if (btn) btn.style.display = show ? "" : "none";
      }

      // ===============================
      // Biblioteca local
      // ===============================
      async function loadLibrary() {
        let { games, completedGames } = await window.electronAPI.getGames();
        sagasCache = (await window.electronAPI.getSagas()) || [];

        libraryIds.clear();
        if (Array.isArray(games)) games.forEach((g) => libraryIds.add(g.id));
        if (Array.isArray(completedGames))
          completedGames.forEach((g) => libraryIds.add(g.id));

        games = games.slice().sort((a, b) => {
          const ak = (a.sortKey || a.name || "").toString();
          const bk = (b.sortKey || b.name || "").toString();
          return ak.localeCompare(bk, "es", { sensitivity: "base" });
        });

        libraryGamesCache = games;
        completedGamesCache = Array.isArray(completedGames) ? completedGames : [];
        applyLibraryFilter();
        renderCompletedList();
        updateGamepadFocus(true);
      }

      // Busca la saga (si hay) a la que pertenece un juego.
      function sagaForGame(gameId) {
        const gid = Number(gameId);
        return sagasCache.find((s) => s.gameIds.includes(gid));
      }

      // "Juegos pasados" ya no se ordena por nombre: se ordena por fecha de
      // finalización (más reciente arriba). Los juegos de una misma saga no
      // se dispersan por la línea de tiempo — se agrupan en un único bloque,
      // anclado a la fecha en que se completó el PRIMER juego de esa saga
      // (así, si te pasas 2 y 3 mucho después que 1, siguen "arrastrados"
      // junto a 1 en vez de aparecer sueltos por su propia fecha).
      function buildCompletedTimeline(completedGames, sagas) {
        const gameById = new Map(completedGames.map((g) => [g.id, g]));
        const sagaOfGame = new Map();
        sagas.forEach((s) =>
          s.gameIds.forEach((id) => {
            if (!sagaOfGame.has(id)) sagaOfGame.set(id, s);
          })
        );

        const entries = [];
        const consumed = new Set();

        completedGames.forEach((g) => {
          const saga = sagaOfGame.get(g.id);
          if (saga) {
            if (consumed.has(saga.id)) return;
            consumed.add(saga.id);
            const members = saga.gameIds.map((id) => gameById.get(id)).filter(Boolean);
            if (!members.length) return;
            const anchor = Math.min(...members.map((m) => m.completedAt || 0));
            entries.push({ type: "saga", saga, games: members, date: anchor });
          } else {
            entries.push({ type: "game", game: g, date: g.completedAt || 0 });
          }
        });

        entries.sort((a, b) => b.date - a.date);
        return entries;
      }

      function renderCompletedList() {
        const container = document.getElementById("completedList");
        container.innerHTML = "";

        if (!completedGamesCache.length) {
          container.innerHTML = `
            <div class="empty-state">
              <p class="empty-title">Aún no has completado ningún juego.</p>
              <p class="empty-text">Es hora de jugar. Cuando termines un juego podrás marcarlo como pasado.</p>
              <button class="primary" onclick="showSection('library', document.querySelectorAll('.topnav-item')[1])">
                Ir a mi biblioteca
              </button>
            </div>
          `;
          return;
        }

        const entries = buildCompletedTimeline(completedGamesCache, sagasCache);

        entries.forEach((entry) => {
          if (entry.type === "game") {
            container.appendChild(buildGameCard(entry.game, "completed"));
            return;
          }
          container.appendChild(
            buildSagaGroup(entry.saga, entry.games, (g) => buildGameCard(g, "completed"))
          );
        });
      }

      function currentGridColumns() {
        const cols = Number(getComputedStyle(document.documentElement).getPropertyValue("--grid-cols")) || 5;
        return window.innerWidth <= 700 ? Math.min(cols, 2) : cols;
      }

      // Bloque de saga dentro de una rejilla (biblioteca y pasados). Ocupa
      // solo tantas columnas como juegos tenga (hasta el máximo de la fila),
      // así se coloca en línea con el resto de cards en vez de partir la
      // fila y dejar huecos. Cada card lleva su número dentro de la saga (el
      // de la saga completa, aunque alguno esté en la otra sección).
      function buildSagaGroup(saga, gamesInOrder, buildCard, letter) {
        const wrap = document.createElement("div");
        wrap.className = "saga-group";
        wrap.dataset.sagaId = saga.id;
        if (letter) wrap.dataset.letter = letter;
        const span = Math.max(1, Math.min(gamesInOrder.length, currentGridColumns()));
        wrap.style.gridColumn = `span ${span}`;
        wrap.style.setProperty("--saga-cols", span);

        const total = saga.gameIds.length;
        const header = document.createElement("div");
        header.className = "saga-group-header";
        header.innerHTML = `
          <span class="saga-group-icon">${icon("layers")}</span>
          <span class="saga-group-name">${escapeHtml(saga.name)}</span>
          <span class="saga-group-count">${total} ${total === 1 ? "juego" : "juegos"}</span>
          <button type="button" class="icon-btn saga-group-edit" title="Editar saga" aria-label="Editar saga">${icon("pencil")}</button>
        `;
        header.querySelector(".saga-group-edit").onclick = () => openSagasModal(saga.id);
        wrap.appendChild(header);

        gamesInOrder.forEach((g) => {
          const card = buildCard(g);
          const pos = saga.gameIds.indexOf(Number(g.id)) + 1;
          const cover = card.querySelector(".card-cover");
          if (cover && pos > 0) {
            cover.insertAdjacentHTML("beforeend", `<span class="saga-order" title="Orden en la saga">${pos}</span>`);
          }
          wrap.appendChild(card);
        });

        return wrap;
      }

      // Botones de una card de biblioteca o de pasados. "Jugar" sale siempre
      // que el juego se pueda lanzar (por .exe o por su launcher); "Vincular"
      // solo cuando no hay ninguna forma de lanzarlo.
      function cardActionsHtml(game, mode) {
        const id = game.id;
        const playable = canPlay(game);
        const linkBtn = game.executable
          ? `<button class="linked-btn is-icon" onclick="confirmUnlink('${id}')" title="Ejecutable vinculado (clic para desvincular)" aria-label="Ejecutable vinculado">${icon("link")}</button>`
          : playable
          ? ""
          : `<button onclick="setExecutable('${id}')">${icon("link")}<span>Vincular</span></button>`;
        const playBtn = playable
          ? `<button class="primary" onclick="launchGame('${id}')">${icon("play")}<span>Jugar</span></button>`
          : "";

        const saga = sagaForGame(id);
        const sagaItem = saga
          ? `<div class="dropdown-item" onclick="removeGameFromItsSaga('${id}')">${icon("layers")}Quitar de "${escapeHtml(saga.name)}"</div>`
          : `<div class="dropdown-item" onclick="openAddToSagaModal('${id}')">${icon("layers")}Añadir a una saga</div>`;
        const exeItem = !game.executable && playable
          ? `<div class="dropdown-item" onclick="setExecutable('${id}')">${icon("link")}Vincular ejecutable</div>`
          : "";

        const items =
          mode === "completed"
            ? `
              <div class="dropdown-item" onclick="openInfoModal('${id}')">${icon("info")}Información</div>
              <div class="dropdown-item" onclick="togglePlatinum('${id}')">${icon("crown")}${game.isPlatinum ? "Quitar platino" : "Marcar platino"}</div>
              ${sagaItem}
              <div class="dropdown-item" onclick="returnToLibrary('${id}')">${icon("arrowUp")}Volver a biblioteca</div>
              <div class="dropdown-item is-danger" onclick="removeFromLibrary('${id}')">${icon("trash")}Quitar de pasados</div>`
            : `
              <div class="dropdown-item" onclick="openInfoModal('${id}')">${icon("info")}Información</div>
              <div class="dropdown-item" onclick="markCompleted('${id}')">${icon("check")}Marcar como pasado</div>
              ${sagaItem}
              ${exeItem}
              <div class="dropdown-item" onclick="openSortKeyEditor('${id}')">${icon("pencil")}Nombre para ordenar</div>
              <div class="dropdown-item is-danger" onclick="removeFromLibrary('${id}')">${icon("trash")}Quitar de biblioteca</div>`;

        return `
          ${linkBtn}
          ${playBtn}
          <div class="action-menu">
            <button class="more-btn" onclick="toggleDropdown(event, '${id}')" title="Más opciones" aria-label="Más opciones">${icon("more")}</button>
            <div id="dropdown-${id}" class="dropdown-content">${items}</div>
          </div>
        `;
      }

      function refreshSearchUI() {
        gamesTemp = [];
        displayGames("gamesList", currentSearchGames, "add");
        updateGamepadFocus(true);
      }

      // ===============================
      // Acciones
      // ===============================
      // Cambia solo el botón de la tarjeta ya en pantalla, sin repintar toda
      // la rejilla (repintarla reseteaba el scroll a arriba del todo).
      // Al añadirlo desaparece de Descubrir (sale con una transición corta).
      function markGameOwnedInGrid(gameId) {
        const card = document.querySelector(`#gamesList [data-game-id="${gameId}"]`);
        currentSearchGames = currentSearchGames.filter((g) => g.id !== gameId);
        if (discoverSearchPool) {
          discoverSearchPool = discoverSearchPool.filter((g) => g.id !== gameId);
          discoverSearchShown = Math.max(0, discoverSearchShown - 1);
        }
        if (!card) return;
        card.classList.add("is-leaving");
        setTimeout(() => {
          card.remove();
          updateGamepadFocus(true);
        }, 280);
      }

      async function addFromJson(game) {
        try {
          await window.electronAPI.addGame(game);
          await loadLibrary();
          markGameOwnedInGrid(game.id);
          showNotification(
            `"${game.name}" agregado a la biblioteca correctamente.`
          );
        } catch (error) {
          console.error(error);
          showNotification(`Error al agregar "${game.name}".`, "error");
        }
      }

      // Un solo paso: elegir el .exe y listo. La plataforma (Steam/Epic/GOG)
      // se detecta sola por la ruta del ejecutable, solo para mostrarla; no
      // hace falta preguntarla porque un juego vinculado a mano siempre se
      // lanza directamente, no cambia nada en el arranque.
      async function setExecutable(id) {
        try {
          const result = await window.electronAPI.openFileDialog();
          if (result.canceled) return;

          await window.electronAPI.setExecutable(id, { path: result.filePath });
          await loadLibrary();
          refreshSearchUI();
          showNotification("Ejecutable vinculado correctamente");
        } catch (err) {
          console.error(err);
          showNotification("Error al vincular el ejecutable", "error");
        }
      }

      // ===============================
      // Lanzar juego (modal "Abriendo...")
      // ===============================
      // main.js va contando los pasos (arrancar el cliente, abrir el juego,
      // verlo ya en marcha) y aquí se reflejan en el modal. Se cierra solo
      // cuando el juego arranca o al rato de lanzarlo; si falla, se queda
      // abierto contando por qué.
      const CLIENT_NAMES = { steam: "Steam", epic: "Epic Games", gog: "GOG Galaxy" };
      let currentLaunch = null;

      function viaLauncher(g) {
        return (
          (g.platform === "steam" && g.steamAppId) ||
          (g.platform === "epic" && g.epicAppName) ||
          (g.platform === "gog" && g.gogGameId)
        );
      }

      function setLaunchState(state, text, iconName) {
        const box = document.querySelector(".sl-launch");
        if (!box) return;
        box.dataset.state = state;
        box.querySelector(".sl-launch-text").textContent = text;
        const ic = box.querySelector(".sl-launch-status");
        ic.innerHTML = iconName ? icon(iconName) : `<span class="sl-spinner"></span>`;
      }

      function launchStepText(step, g) {
        const client = CLIENT_NAMES[g.platform] || "el launcher";
        if (step === "client") return [`Abriendo ${client}…`, `El juego se abrirá en cuanto ${client} esté listo.`];
        if (step === "launching")
          return viaLauncher(g)
            ? ["Abriendo el juego…", `${client} está iniciando el juego.`]
            : ["Abriendo el juego…", "Iniciando el ejecutable."];
        return ["Preparando…", ""];
      }

      window.electronAPI.onLaunchProgress?.((p) => {
        if (!currentLaunch || Number(p.id) !== Number(currentLaunch.id)) return;
        if (p.step === "running") {
          setLaunchState("ok", "El juego ya está en marcha.", "check");
          document.querySelector(".sl-launch-title").textContent = "¡A jugar!";
          return;
        }
        const [title, text] = launchStepText(p.step, currentLaunch.game);
        document.querySelector(".sl-launch-title").textContent = title;
        setLaunchState("busy", text);
      });

      async function launchGame(id) {
        if (currentLaunch && String(currentLaunch.id) === String(id)) return;
        const g = [...libraryGamesCache, ...completedGamesCache].find((x) => String(x.id) === String(id)) || {
          id,
          name: "Juego",
        };
        const launch = { id, game: g };
        currentLaunch = launch;
        const [title, text] = launchStepText("start", g);

        openModal({
          width: 420,
          html: `
            <div class="sl-launch" data-state="busy">
              <div class="sl-launch-cover"><img src="${coverOf(g)}" alt=""></div>
              <span class="sl-launch-eyebrow">${escapeHtml(g.name)}</span>
              <h3 class="sl-launch-title">${title}</h3>
              <p class="sl-launch-row"><span class="sl-launch-status"><span class="sl-spinner"></span></span><span class="sl-launch-text">${text}</span></p>
            </div>`,
          showConfirmButton: false,
          showCloseButton: true,
          customClass: { popup: "sl-modal-sm" },
          didClose: () => {
            if (currentLaunch === launch) currentLaunch = null;
          },
        });

        let res;
        try {
          res = await window.electronAPI.launchGame(id);
        } catch (err) {
          console.error(err);
          res = { ok: false, error: "Error inesperado al iniciar el juego." };
        }
        if (currentLaunch !== launch) return; // el usuario cerró el modal

        if (!res?.ok) {
          document.querySelector(".sl-launch-title").textContent = "No se ha podido abrir";
          setLaunchState("error", res?.error || "Error al iniciar el juego.", "alert");
          currentLaunch = null;
          return;
        }

        if (res.running) {
          setTimeout(() => currentLaunch === null && Swal.isVisible() && document.querySelector(".sl-launch") && Swal.close(), 1600);
        } else {
          document.querySelector(".sl-launch-title").textContent = "Juego lanzado";
          setLaunchState(
            "ok",
            viaLauncher(g)
              ? `Si no aparece en unos segundos, revisa ${CLIENT_NAMES[g.platform]}.`
              : "Si no aparece en unos segundos, revisa que el ejecutable sea el correcto.",
            "check"
          );
          setTimeout(() => currentLaunch === null && Swal.isVisible() && document.querySelector(".sl-launch") && Swal.close(), 3500);
        }
        currentLaunch = null;
      }

      async function markCompleted(id) {
        await window.electronAPI.markCompleted(id);
        loadLibrary();
      }

      async function returnToLibrary(id) {
        await window.electronAPI.returnToLibrary(id);
        loadLibrary();
      }

      async function removeFromLibrary(id) {
        const game = [...libraryGamesCache, ...completedGamesCache].find((g) => String(g.id) === String(id));
        const ok = await confirmDialog({
          title: game ? `¿Quitar "${game.name}"?` : "¿Quitar de la biblioteca?",
          text: "Se borra de Sharingan Launcher (no se desinstala nada). No se puede deshacer.",
          confirmText: "Quitar",
          danger: true,
        });
        if (!ok) return;

        await window.electronAPI.removeGame(Number(id));
        await loadLibrary();
        refreshSearchUI();
        showNotification("Juego eliminado de la biblioteca.");
      }

      function toggleDropdown(e, id) {
        e.stopPropagation();
        document.querySelectorAll(".dropdown-content").forEach((d) => {
          if (d.id !== `dropdown-${id}`) d.classList.remove("show");
        });

        const el = document.getElementById(`dropdown-${id}`);
        if (el) el.classList.toggle("show");
      }

      async function togglePlatinum(id) {
        try {
          await window.electronAPI.togglePlatinum(id);
          await loadLibrary();
        } catch (err) {
          console.error(err);
        }
      }

      // ===============================
      // Modal de Información y Requisitos (BEAUTIFIED)
      // ===============================
      async function openInfoModal(id) {
        // 1. Buscar juego local
        let game = libraryGamesCache.find((g) => String(g.id) === String(id));
        if (!game) {
          const all = await window.electronAPI.getGames();
          game =
            all.games.find((g) => String(g.id) === String(id)) ||
            all.completedGames.find((g) => String(g.id) === String(id));
        }
        // Todavia no esta en la biblioteca (se mira desde Juegos populares):
        // se usa el resultado de la busqueda de IGDB tal cual.
        if (!game) {
          game = currentSearchGames.find((g) => String(g.id) === String(id));
        }
        if (!game) return showNotification("Juego no encontrado", "error");

        // Aviso de carga: los 3 pasos siguientes pueden tardar un poco (sobre
        // todo la primera vez, que Steam descarga su lista completa de apps
        // para la busqueda por nombre), y antes no se veia nada mientras tanto.
        loadingModal("Cargando información", game.name);

        // 2+3+3b. IGDB, requisitos de Steam y specs del equipo: independientes
        // entre si, se piden en paralelo en vez de uno detras de otro.
        const [detailsResult, reqsResult, specsResult] = await Promise.allSettled([
          window.electronAPI.getGameDetails(id),
          window.electronAPI.getRealRequirements({
            igdbId: id,
            steamAppId: game.steamAppId,
            gameName: game.name,
          }),
          window.electronAPI.getSystemSpecs(),
        ]);

        let details = null;
        if (detailsResult.status === "fulfilled" && detailsResult.value?.length > 0) {
          details = detailsResult.value[0];
        } else if (detailsResult.status === "rejected") {
          console.error(detailsResult.reason);
        }

        let reqs = { min: "No disponible", rec: "No disponible" };
        if (reqsResult.status === "fulfilled" && reqsResult.value) {
          reqs = reqsResult.value;
        } else if (reqsResult.status === "rejected") {
          console.error(reqsResult.reason);
        }

        let mySpecs = null;
        if (specsResult.status === "fulfilled") {
          mySpecs = specsResult.value;
        } else {
          console.error(specsResult.reason);
        }

        // --- HELPER: Función para embellecer el texto de Steam ---
        // Comparación numérica fiable contra tu equipo en RAM, VRAM,
        // almacenamiento libre y versión de Windows — son las únicas que se
        // pueden comparar con un número sin ambigüedad. El modelo de CPU/GPU
        // se muestra informativo, sin veredicto: comparar "Core i5-8400" vs
        // "Ryzen 5 3600" de forma fiable necesitaría una base de datos de
        // benchmarks (tipo PassMark) que no tenemos, y un veredicto
        // equivocado ahí es peor que no dar ninguno.
        const extractGb = (str) => {
          const m = str.match(/(\d+(?:[.,]\d+)?)\s*GB/i);
          return m ? parseFloat(m[1].replace(",", ".")) : NaN;
        };
        const extractWinVersion = (str) => {
          const m = str.match(/windows\s*(\d+)/i);
          return m ? parseInt(m[1], 10) : NaN;
        };

        const formatSteamReqs = (text) => {
          if (!text || text.includes("No disponible"))
            return '<p class="req-val" style="opacity:0.5">Información no disponible.</p>';

          const lines = text.split("\n");
          let html = '<div class="req-list">';

          lines.forEach((line) => {
            let cleanLine = line.trim();
            if (!cleanLine) return;

            // Filtros: Quitamos lineas que solo dicen "Minimo" o "Recomendado" porque ya tenemos titulo
            const lower = cleanLine.toLowerCase();
            if (
              lower === "mínimo:" ||
              lower === "recomendado:" ||
              lower === "mínimo" ||
              lower === "recomendado"
            )
              return;

            // Detectar "Clave: Valor"
            // Buscamos el primer ':'
            const splitIdx = cleanLine.indexOf(":");

            if (splitIdx > -1 && splitIdx < 20) {
              // Si hay ':' al principio (ej: "OS: Win10")
              const key = cleanLine.substring(0, splitIdx).trim();
              const val = cleanLine.substring(splitIdx + 1).trim();

              // Limpiar viñetas si las hay
              const cleanKey = key.replace(/•/g, "").trim();
              const safeKey = escapeHtml(cleanKey);
              const safeVal = escapeHtml(val);
              const keyLower = cleanKey.toLowerCase();

              let lineClass = "req-line";
              if (mySpecs) {
                if (/memoria|^ram$/i.test(keyLower)) {
                  const req = extractGb(val);
                  if (!Number.isNaN(req)) {
                    lineClass += mySpecs.ram >= req ? " req-pass" : " req-fail";
                  }
                } else if (/almacenamiento|espacio|storage/i.test(keyLower)) {
                  const req = extractGb(val);
                  if (!Number.isNaN(req) && mySpecs.freeStorage != null) {
                    lineClass += mySpecs.freeStorage >= req ? " req-pass" : " req-fail";
                  }
                } else if (/^so$|^os$|sistema operativo/i.test(keyLower)) {
                  const req = extractWinVersion(val);
                  const mine = extractWinVersion(mySpecs.os || "");
                  if (!Number.isNaN(req) && !Number.isNaN(mine)) {
                    lineClass += mine >= req ? " req-pass" : " req-fail";
                  }
                } else if (/vram/i.test(val) || /vram/i.test(keyLower)) {
                  const req = extractGb(val);
                  if (!Number.isNaN(req) && mySpecs.vram) {
                    lineClass += mySpecs.vram >= req ? " req-pass" : " req-fail";
                  }
                }
              }

              html += `
               <div class="${lineClass}">
                 <span class="req-key">${safeKey}</span>
                 <span class="req-val">${safeVal}</span>
               </div>
             `;
            } else {
              // Es una linea de texto normal o una nota
              html += `
               <div class="req-line">
                 <span class="req-val">${escapeHtml(cleanLine.replace(/•/g, "").trim())}</span>
               </div>
             `;
            }
          });
          html += "</div>";
          return html;
        };

        const mySpecsHtml = mySpecs
          ? `<p class="my-specs">Tu equipo: ${escapeHtml(mySpecs.cpu)} · ${mySpecs.ram} GB RAM · ${escapeHtml(mySpecs.gpu)}${
              mySpecs.freeStorage != null ? ` · ${mySpecs.freeStorage} GB libres` : ""
            }</p>`
          : "";

        // 4. Renderizar
        const coverUrl = details?.cover?.image_id
          ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${details.cover.image_id}.jpg`
          : game.coverUrl || "assets/no-cover.png";
        const genres = details?.genres?.map((g) => g.name).join(", ") || "";

        const html = `
        <div class="info-modal-grid">
          <div><img src="${coverUrl}" class="info-cover"></div>
          <div class="info-details">
             <h3>${escapeHtml(game.name)}</h3>
             <p class="info-genres">${escapeHtml(genres)}</p>
             
             <div class="req-real-container">
                <div class="req-box">
                   <h4 class="req-title">MÍNIMOS</h4>
                   ${formatSteamReqs(reqs.min)}
                </div>
                <div class="req-box">
                   <h4 class="req-title">RECOMENDADOS</h4>
                   ${formatSteamReqs(reqs.rec)}
                </div>
             </div>
             
             ${mySpecsHtml}
             <p class="info-source">Requisitos: Steam Store</p>
          </div>
        </div>
      `;

        openModal({
          html: html,
          width: 950,
          showConfirmButton: false,
          showCloseButton: true,
          customClass: { popup: "info-popup" },
        });
      }

      // ===============================
      // Pintar cards reutilizable
      // ===============================
      // Card de un juego "pasado" (completado) — usada tanto para sueltos
      // como para los que van dentro de un bloque de saga.
      function buildGameCard(game, mode) {
        const div = document.createElement("div");
        div.className = "game-card";
        div.dataset.gameId = game.id;

        const name = game.name || "Sin nombre";
        if (game.isPlatinum) div.classList.add("platinum-card");
        const crownHtml = game.isPlatinum
          ? `<span class="platinum-crown" title="Platino">${icon("crown")}</span>`
          : "";

        div.innerHTML = `
          ${crownHtml}
          <div class="card-cover"><img src="${coverOf(game)}" alt="${escapeHtml(name)}" loading="lazy"></div>
          <h3>${escapeHtml(name)}</h3>
          <div class="card-actions">${cardActionsHtml(game, mode)}</div>
        `;

        return div;
      }

      // Card de Descubrir ("add"). Aparte porque además de renderizarse en
      // bloque (displayGames) se necesita para ir añadiendo una a una al
      // pulsar "Cargar más", sin repintar lo que ya había.
      function buildDiscoverCard(game) {
        const div = document.createElement("div");
        div.className = "game-card";
        div.dataset.gameId = game.id;
        div.dataset.letter = letterBucket(game.name);

        const name = game.name || "Sin nombre";
        const safeAttrName = name.replace(/"/g, "&quot;");
        const coverUrl =
          game.coverUrl ||
          (game.cover && game.cover.image_id
            ? `https://images.igdb.com/igdb/image/upload/t_cover_big/${game.cover.image_id}.jpg`
            : "assets/no-cover.png");

        const index = gamesTemp.length;
        gamesTemp.push(game);

        const buttonsHtml = libraryIds.has(game.id)
          ? `<span class="badge-owned">En tu biblioteca</span>${infoButtonHtml(game.id)}`
          : `<button class="primary add-btn" data-index='${index}'>Agregar a biblioteca</button>${infoButtonHtml(game.id)}`;

        div.innerHTML = `
          <div class="card-cover"><img src="${coverUrl}" alt="${safeAttrName}"></div>
          <h3>${escapeHtml(name)}</h3>
          <div class="card-actions">${buttonsHtml}</div>
        `;

        return div;
      }

      // Cubetas del índice A-Z (biblioteca y Descubrir): símbolos, números y
      // letras (con la Ñ en su sitio, como en cualquier listado en español).
      const INDEX_BUCKETS = [
        "#", "0-9", "A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L",
        "M", "N", "Ñ", "O", "P", "Q", "R", "S", "T", "U", "V", "W", "X", "Y", "Z",
      ];

      function letterBucket(str) {
        const s = (str || "").trim();
        if (!s) return "#";
        const ch = s[0].toUpperCase();
        if (ch === "Ñ") return "Ñ";
        if (/[A-Z]/.test(ch)) return ch;
        if (/[0-9]/.test(ch)) return "0-9";
        return "#";
      }

      function renderLibraryIndexBar(keysShown) {
        const bar = document.getElementById("libraryIndexBar");
        if (!bar) return;

        const present = new Set(keysShown.map((k) => letterBucket(k)));
        bar.innerHTML = INDEX_BUCKETS.map((b) => {
          const has = present.has(b);
          return `<button type="button" class="index-btn" data-bucket="${b}" ${has ? "" : "disabled"}>${b}</button>`;
        }).join("");

        bar.querySelectorAll(".index-btn:not([disabled])").forEach((btn) => {
          btn.onclick = () => {
            // Primero el juego suelto con esa letra; si solo hay una saga, la saga.
            const sel = `[data-letter="${CSS.escape(btn.dataset.bucket)}"]`;
            const target =
              document.querySelector(`#libraryList > .game-card${sel}`) ||
              document.querySelector(`#libraryList > ${sel}`);
            if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
          };
        });
      }

      // Índice de Descubrir: aquí NO se sabe de antemano qué letras existen
      // (hay paginación, tanto server-side como sobre el pool de búsqueda),
      // así que nunca se deshabilita ningún botón - al pulsar una letra que
      // aún no está pintada, se van pidiendo más páginas (o revelando más
      // del pool ya descargado en el caso de búsqueda) hasta encontrarla o
      // agotar los resultados.
      let discoverIndexBarBuilt = false;

      function renderDiscoverIndexBar() {
        const bar = document.getElementById("discoverIndexBar");
        if (!bar || discoverIndexBarBuilt) return;
        discoverIndexBarBuilt = true;

        bar.innerHTML = INDEX_BUCKETS.map(
          (b) => `<button type="button" class="index-btn" data-bucket="${b}">${b}</button>`
        ).join("");

        bar.querySelectorAll(".index-btn").forEach((btn) => {
          btn.onclick = () => jumpToDiscoverLetter(btn.dataset.bucket);
        });
      }

      // IGDB soporta un filtro de prefijo ("name = \"P\"*") que devuelve
      // solo los juegos que empiezan por esa letra en una única petición,
      // sea cual sea el tamaño del catálogo - por eso esto es instantáneo y
      // no puede "no encontrar" una letra que sí existe (antes se pedían
      // páginas en serie desde donde se había quedado la búsqueda, lo que
      // con catálogos grandes podía tardar mucho y acabar fallando igual).
      async function jumpToDiscoverLetter(bucket) {
        if (bucket === "#") {
          // Apicalypse no tiene forma fiable de filtrar "no empieza por
          // letra ni número" - se comprueba solo lo que ya hay cargado.
          const target = document.querySelector('#gamesList [data-letter="#"]');
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
          else showNotification('No hay juegos con nombres de símbolos con estos filtros.', "error");
          return;
        }

        const genreId = document.getElementById("genreFilter")?.value || null;
        const sort = document.getElementById("sortFilter")?.value || "popular";

        discoverActiveLetter = bucket;
        discoverOffset = 0;
        discoverSearchPool = null;
        discoverSearchShown = 0;
        gamesTemp = [];
        currentSearchGames = [];

        const res = await window.electronAPI.discoverGames({
          query: "",
          genreId,
          sort,
          offset: 0,
          letterPrefix: bucket,
        });
        await applyDiscoverPage(res, true);

        if (res?.items?.length) {
          document.getElementById("gamesList")?.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          showNotification(`No hay ningún juego por "${bucket}" con estos filtros.`, "error");
        }
      }

      function displayGames(containerId, games, mode) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (!Array.isArray(games)) return;

        if (games.length === 0) {
          if (mode === "library") {
            container.innerHTML = `
            <div class="empty-state">
              <p class="empty-title">Todavía no tienes juegos en tu biblioteca.</p>
              <p class="empty-text">Busca juegos en la sección de populares y añádelos a tu biblioteca.</p>
              <button class="primary" onclick="showSection('popular', document.querySelectorAll('.topnav-item')[0])">
                Buscar juegos
              </button>
            </div>
          `;
            return;
          }

        }

        if (mode === "add") {
          games.forEach((game) => container.appendChild(buildDiscoverCard(game)));
          return;
        }

        // Biblioteca: primero las sagas (cada una un bloque con sus juegos en
        // el orden de la saga) y debajo los juegos sueltos por orden
        // alfabético, separados por un título.
        const entries = buildLibraryEntries(games);
        const hasSagas = entries.some((e) => e.type === "saga");
        const hasLoose = entries.some((e) => e.type === "game");
        entries.forEach((entry, i) => {
          if (entry.type === "saga") {
            container.appendChild(
              buildSagaGroup(entry.saga, entry.games, (g) => buildGameCard(g, "library"), letterBucket(entry.key))
            );
            return;
          }
          if (hasSagas && entries[i - 1]?.type === "saga") {
            const divider = document.createElement("div");
            divider.className = "library-divider";
            divider.innerHTML = `<span>Juegos sueltos</span>`;
            container.appendChild(divider);
          }
          const card = buildGameCard(entry.game, "library");
          card.dataset.letter = letterBucket(entry.key);
          container.appendChild(card);
        });
        container.classList.toggle("has-sagas-only", hasSagas && !hasLoose);

        if (mode === "library") renderLibraryIndexBar(entries.map((e) => e.key));
      }

      function buildLibraryEntries(list) {
        const byId = new Map(list.map((g) => [Number(g.id), g]));
        const grouped = new Set();
        const entries = [];

        sagasCache.forEach((saga) => {
          const members = saga.gameIds.map((id) => byId.get(Number(id))).filter(Boolean);
          if (!members.length) return;
          members.forEach((m) => grouped.add(Number(m.id)));
          entries.push({ type: "saga", saga, games: members, key: saga.name || "" });
        });

        const byKey = (a, b) => a.key.localeCompare(b.key, "es", { sensitivity: "base", numeric: true });
        const loose = list
          .filter((g) => !grouped.has(Number(g.id)))
          .map((g) => ({ type: "game", game: g, key: g.sortKey || g.name || "" }))
          .sort(byKey);

        return [...packSagaRows(entries.sort(byKey)), ...loose];
      }

      // Coloca las sagas por filas sin dejar huecos: en cada fila va la
      // primera saga (por orden alfabético) que quepa en lo que queda, así
      // un bloque grande no deja media fila vacía detrás de uno pequeño.
      function packSagaRows(sagaEntries) {
        const cols = currentGridColumns();
        const pending = sagaEntries.slice();
        const out = [];
        let free = cols;
        while (pending.length) {
          let idx = pending.findIndex((e) => Math.min(e.games.length, cols) <= free);
          if (idx === -1) {
            free = cols;
            continue;
          }
          const [entry] = pending.splice(idx, 1);
          out.push(entry);
          free -= Math.min(entry.games.length, cols);
          if (free === 0) free = cols;
        }
        return out;
      }

      document.addEventListener("click", (e) => {
        if (e.target.classList.contains("add-btn")) {
          const idx = Number(e.target.dataset.index);
          if (gamesTemp[idx]) addFromJson(gamesTemp[idx]);
        }
      });

      // ===============================
      // Notificaciones
      // ===============================
      function showNotification(message, type = "success") {
        const container = document.getElementById("notification-container");
        const notification = document.createElement("div");
        notification.className = `notification ${type}`;
        notification.innerText = message;
        container.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
      }

      // ===============================
      // Filtro biblioteca
      // ===============================
      function toggleLinkedFilter() {
        showOnlyLinked = !showOnlyLinked;
        localStorage.setItem("libraryLinkedFilter", showOnlyLinked);
        applyLibraryFilter();
        updateGamepadFocus(true);
      }

      function applyLibraryFilter() {
        const btn = document.getElementById("linkedFilterBtn");
        btn.classList.toggle("active", showOnlyLinked);

        let gamesToShow = libraryGamesCache;
        if (showOnlyLinked) gamesToShow = libraryGamesCache.filter(canPlay);

        const title = document.getElementById("libraryTitle");
        title.textContent = `Juegos (${gamesToShow.length})`;

        displayGames("libraryList", gamesToShow, "library");
      }

      async function confirmUnlink(id) {
        const ok = await confirmDialog({
          title: "¿Desvincular el ejecutable?",
          text: "El juego sigue en tu biblioteca; solo se olvida qué .exe lanzar.",
          confirmText: "Desvincular",

        });
        if (!ok) return;

        try {
          await window.electronAPI.unlinkExecutable(id);
          await loadLibrary();
          refreshSearchUI();
